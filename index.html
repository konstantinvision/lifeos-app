d two fields stop cutting his words off. DAY CARD, the shape he picked after several rounds: the date keeps its exact 16px and the cell keeps its exact 68px height, nothing shrunk or merged. A single hairline divider now sits under the date, so the card reads as two blocks, which day above and how the day went below. Mood and streak were 7px and 6px, two sizes for two readings of equal weight, and are now both 8px. The note dot moves from top right to TOP LEFT and is grey rather than purple, which was pulling more attention than a note deserves. Wins-logged changes from a corner tick to a bar along the bottom edge: binary, present or absent, and deliberately NOT tied to the day score, because a filled progress line already exists in the Week Runner and a second one would say something the app does not mean. ON THE SELECTED DAY EVERYTHING IS GOLD: energy, percent, mood, streak, the note dot and the bar all take #e8c98f, so the dark cell reads as one object instead of a dark card with five differently coloured marks scattered on it. Energy and mood keep their own colours on every unselected day, because those colours carry the reading. TWO HEIGHT CAPS REMOVED, and this was a real bug rather than a preference: a Top 3 task was clamped to 54px and a Week Priority to 30px, so a long one was silently cut off mid-word with no indication that more text existed. Both now grow to fit, with the old heights kept as minimums so a short entry looks exactly as it did. NEXT, on its own: a completed Top 3 task copies itself into that day's Wins as a new row. One-way, a copy and not a link, so editing the win never rewrites the task and editing the task never overwrites a win he has already expanded. No localStorage key added, renamed or removed · prev: Life OS v10.78 · A NOT DONE cell state, and it counts as nothing. The grid had no way to say "I looked at this and the answer is no", so an empty cell meant both "missed it" and "have not decided yet", and his eye kept going back over ing, so the very first + NEW WIN of a day wrote nothing and the row vanished the instant it appeared. An empty day now yields one empty row. Second: pressing Enter twice while writing produced a blank line INSIDE a win, which the separator rule would then have read as a split, tearing the win in half and moving the cursor mid-sentence. Blank lines inside a single row are now collapsed to one newline. THE GUARANTEE, stated precisely rather than implied: split then join is byte-for-byte identical, verified over thousands of generated inputs. The single exception is a separator line that holds only spaces or tabs, which normalizes to a plain blank line. No visible character is ever altered and no line is ever lost, and that is asserted separately over thousands more inputs including deliberately messy ones. WHAT HE WILL SEE ON FIRST OPEN: a past day whose wins were already separated by blank lines splits into the right rows on its own. A past day written with single newlines opens as ONE row holding everything, with every word present, to be split by hand once. No localStorage key added, renamed or removed · prev: Life OS v10.75 · A weight for the Highlight, and one symbol per fact. HIGHLIGHT gained a RATE badge in its header that cycles 0, ⭐, ⭐⭐, ⭐⭐⭐ and back. No 💎 and no fourth step: the diamond belongs to the wins scale and is not borrowed here. Stored under a NEW key lifeos_v8_hlStars, added not repurposed, and absent means unrated rather than rated zero, so every highlight written before today reads as untouched. The badge holds a fixed width so the header does not jump as the count changes, and it reads RATE while empty so the control explains itself. THE WEEK STRIP no longer marks a logged day with ⭐. In this system a star carries weight and is meant to be rare, while LOGGED only means the day was recorded, which is exactly what the card's own checkbox already said with a tick. The strip and the card were saying the same fact with two different symbols, and the ng through save() on every keystroke, which is how Note, Highlight, Brainstorm and Carried Over already behave. Two guards died with the edit mode and are named here rather than hidden: the same project can now be added twice (Top 3 has always allowed that too), and an empty row is allowed to sit there, because that is what add-then-type means. The header count only counts rows with text in them, and the week export filters empty rows out, so an unnamed row never reaches Sunday. HOLD TO DRAG, 180ms, on Top 3 and Future Projects. A drag used to begin on the very first touch, so a thumb landing on the handle mid-scroll reordered the day silently. Nothing is picked up until the finger has stayed put for HOLD_MS, and any movement before that kills the gesture outright rather than starting a drag late. Mouse drag is untouched. Verified: a quick swipe reorders nothing, a held drag still lifts and reinserts (dragging item 5 to the top pushes 1-4 down one place each rather than swapping), a done tick still travels with its task, and a touchend before the hold lands leaves no timer running. HANDLES unified: Future Projects now uses the same 36px block and 17px glyph as Top 3, and the rank number sits centred over the dots. The T1/T2/T3 labels were off-centre for the same reason everywhere: letterSpacing adds a trailing gap after the last character, so a centred box renders its text left by exactly that much. Compensated with a matching paddingLeft rather than dropping the letter-spacing, which is doing real work at 8px. BRAINSTORM rows gained a left stripe like the other lists, a warm stone #c4b8a4 at 1.96:1 against the white card, half again as visible as the first attempt, with a pinned idea taking the deep gold #a8874a already used in this card's own header, so the two differ in HUE and not only in brightness; a pinned row also keeps its warm background tint and its solid 🔝 button, so three signals carry it, not one. THE ✕ IS ONE BUTTON NOW in Future Projects, Brainstorm th no artificial limit on length or count. No localStorage key added, renamed or removed · prev: Life OS v10.70 · ESCALATED, FUTURE PROJECTS and CARRIED OVER brought into one row style, and the escalated to Top 3 flow made legible. FUTURE PROJECTS reordering is now the SAME drag handle the Top 3 board uses, replacing the up and down arrows added in v10.61. He was right that two different gestures for the same job is why the lists felt unrelated. The move also changed from a swap to a lift and reinsert, matching Top 3: a swap is wrong across several rows, since dragging item 5 to the top must push 1 to 4 down one place each rather than trade 5 with 1. Same 34px handle, same touchAction none, same drop indicator. ESCALATED rows were clipped to a single line with an ellipsis, so a long task could not be read at all while Future Projects wrapped freely. They now show up to three lines. Each row also shows the day it was flagged, which was already being stored as `since` and had never been displayed. The button changed from "↑ T1" to "→ TOP 3", since the old label named a slot rather than saying where the task was going. Rows are keyed by the task text instead of the array index, so removing one no longer risks React reusing the wrong row. ANSWERED IN THE UI rather than left to be inferred: sending a task to Top 3 does NOT clear its flag. It disappears from the list only because the card filters out anything already sitting in today's slots, which is what the "NOT IN TODAY'S TOP 3" subtitle means. That rule was invisible, so it is now stated in a line under the header, and only the ✕ button removes a flag. VERIFIED, no bugs in the move itself, 32 checks: the task lands as T1 and pushes the rest down without dropping the old T3 off the end; done ticks and carry flags travel WITH their tasks rather than staying on the slot number; trailing empty rows are reused instead of being preserved as gaps; a full ten-row day refuses with a message rather than silently discarding the stroke must stay reversible. Weekly Wins is not money, and checking how the rest of the app already handles free text settled it: Note, Highlight, Mood Shift, Brainstorm, Carried Over and Future Projects all write straight through on every keystroke via mutData or their own save(), with no draft state and no button, because a single useEffect already persists allData on every change. Weekly Wins was the one field in the whole app still copying the value into local state and needing an explicit push, which is exactly why a missing key could make it go stale (v10.66) and exactly why a permanent button was forgettable now. The local draft and fin state are gone. The textarea reads directly from the weeklyWins prop and writes back through save() on every change, matching how Highlight and Note already work. The FINAL toggle and the COPY button read the same derived text, so there is no local copy anywhere that could disagree with what is actually stored. A small SAVED flash now appears next to the week label for a moment after each change, passive confirmation rather than a button demanding to be pressed. The label above the textarea changed from "PASTE THE FULL PROCESSED LIST" to "SAVES AS YOU TYPE" to say what actually happens now. The scroll-jump fix from v10.66 carries over unchanged for FINAL, and was extended to the COPY button too, since it also blurs the field. AVG, ALL 3, and the RAW WINS header are untouched. No localStorage key added, renamed or removed · prev: Life OS v10.66 · The reported bug in Weekly Wins was worse than described. Fixed, plus a discard guard for Budget and Jobs. FIXED, weekly wins showed the same text on every week. He reported this precisely, and the cause is one of the most common React bugs: <WeekWinsCard> was rendered with no key prop, so switching weeks did not remount it, it reused the same component instance, and useState(weeklyWins[key]||"") only evaluates its initial value on the FIRST mount. Whichever week he opened first kept i gered amount can still be backed out cleanly, since nothing is written to the stored entries until the SAVE CHANGES button itself is pressed, verified by confirming a discarded typo never reaches the store and a later edit still starts from the real saved amount. No localStorage key added, renamed or removed · prev: Life OS v10.65 · Glossary corrected against the code, and every em dash removed. GLOSSARY: two definitions had gone stale and were actively wrong. "Escalated" still said "flagged twice in assessments", a mechanism that no longer exists; it is now the lightning button or three days of carrying, and it survives any rewording with only deletion clearing it. "Carried" claimed three days makes a task T1 automatically, which it does not: three days FLAGS it as escalated, and promotion to T1 is a manual tap on the day badge. Both rewritten. Added terms that exist in the app but were never in the glossary: the 4d badge, the Week Runner, and a whole PLAN TAB group covering Brainstorm, Carried Over, Future Projects and Move to today, including the fact that Carried Over is a computed view rather than a store and that Move to today relocates an idea rather than copying it. Checked against the actual constants rather than by eye: Pillars are PW, PA, MS; Essentials are the six codes PB1, RJ, MM, LH, RJ2, PB; Tracking is DT, PR, MV, SM. All three were already correct. EM DASHES: 213 lines changed, every em dash replaced with a plain hyphen. Deliberately a character swap and not a rewrite: most of them sit inside his own mantras and Vision lines, and turning them into commas or full stops would be editing his writing rather than removing a character he does not want. The four export placeholders that used a bare em dash to mean "nothing recorded" became a hyphen too. Two occurrences were left alone on purpose: a bullet detection character class in the Vision renderer, which is a matcher that never reaches the screen and would stop recognising bullets he has already written with an em dash. No localStorage key added, renamed or removed · prev: Life OS v10.64 · Highlight now grows, and the tick and carry button are paired. FIXED, Highlight would not expand while Note, Mood Shift and Wins did. The cause was three different implementations of the same behaviour across four cards: Wins used the shared AutoTextarea component, Note and Mood Shift each carried their own inline ref plus onInput copy of the same growth logic, and Highlight was a plain textarea with a fixed minHeight and no growth at all. All four now use AutoTextarea, so there is ONE growth rule rather than three that can drift and one that was simply missing. MOVED the carry arrow from the far right of a Top 3 row to sit directly beneath the done tick. "Did I do it, or does it move to tomorrow" is a single decision, but answering it meant crossing the whole row twice, once to the tick on the left and once to the arrow on the right. They are now one column, tick on top and carry beneath. Delete, escalate and the day counter stay on the right, since those are separate decisions made far less often. An empty row reserves the carry slot with a spacer rather than leaving it out, so the tick does not jump up and down as text is typed into the row. The tick also grew from 26 to 28px to match the button beneath it. Verified that the carry control appears exactly once and not twice after being moved, that the existing carry, delete, escalation-identity and streak suites all still pass unchanged, and that every piece of text still clears its contrast floor. No localStorage key added, renamed or removed · prev: Life OS v10.63 · Month and Atlas put under the same testing as Today and Plan. One real bug found, in the restore path, which is the last line of defence for the whole dataset. FIXED, a restore could complete halfway and report success. The loop wrote every key inside try{}catch(err){} with an empty body, so if the device refused a write partway through (storage full, which i oks blank but occupies a slot, a task counter that counts something invisible, and the all-three-done celebration that can never fire because total never equals done. Now there is exactly ONE definition, slotFilled(v) and its sibling slotText(v), and all six call sites go through it. Verified against ten inputs including several zero-width spaces, a non-breaking space, and text wrapped in zero-width spaces (which must still count as a real task). GUARDED money against NaN: twelve sums used parseFloat(x.amount||0), where ||0 only rescues empty and null. A stored amount that is a non-numeric string turned an entire quarter total into $NaN. Now (parseFloat(x.amount)||0). Not reachable through the add form, which already rejects non-numbers, so this is protection against hand-edited or corrupted storage rather than a live bug. AUDITED CLEAN after investigation: the 28 flagged duplicate-React-key sites were all false positives on my own heuristic, every one keys a static table (HAT codes, months, weeks, presets) whose values are unique by construction; the audit now excludes them. dayScorePct is check-based, not text-based, so the zero-width bug never touched any score. Every localStorage read sits inside a try/catch, so corrupted storage cannot white-screen the app. The auto-escalate effect is keyed on the day and its task text and never on escalations, so it cannot loop. WEEK TABLE verified end to end: 26 weeks, 13 per quarter, every week exactly 7 days, no overlaps, every number unique, every day belonging to exactly one quarter, and Jul 1-5 correctly Q2 days as the tail of Q2 W13 with Q3 starting Jul 6, matching isQ3Day. Month rollover verified for the carry: Jul 31 to Aug 1, Aug 31 to Sep 1, Sep 30 to Oct 1 across the 30-day month, Oct 31 refused with a message, and no phantom Sep 31. The carry streak walks back over a month boundary correctly and stops at the start of the table instead of looping. KNOWN AND NOT CHANGED: the week table ends Oct 4 while BUDGET_QUARTE   <script>
    if('serviceWorker' in navigator){

        navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'})
          .then(reg=>{
            // Force check for new SW immediately and every 30s
            reg.update();
            setInterval(()=>reg.update(),30000);
            reg.addEventListener('updatefound',()=>{
              const nw=reg.installing;
              if(!nw) return;
              nw.addEventListener('statechange',()=>{
                if(nw.state==='installed'){
                  // Always activate immediately - whether or not there's a controller
                  nw.postMessage({type:'SKIP_WAITING'});
                }
              });
            });
          })
          .catch(e=>console.warn('SW reg failed:',e));
        // When new SW takes control, reload to get fresh content
        navigator.serviceWorker.addEventListener('controllerchange',()=>{
          window.location.reload(true);
        });
      });
    }

  <script>
    // Resilient loader: try jsDelivr, then unpkg, then cloudflare for each library.
    // A single CDN outage can no longer white-screen the app.
    (function(){
      var LIBS=[
        {name:"React",urls:[
          "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js",
          "https://unpkg.com/react@18.3.1/umd/react.production.min.js",
          "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"
        ],check:function(){return window.React;}},
        {name:"ReactDOM",urls:[
          "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js",
          "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js",
          "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"
        ],check:function(){return window.ReactDOM;}},
        {name:"Babel",urls:[
          "https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js",
          "https://unpkg.com/@babel/standalone@7.25.6/babel.min.js",
          "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"
        ],check:function(){return window.Babel;}}
      ];
      function loadOne(lib,done){
        var i=0;
        function attempt(){
          if(lib.check()){done(true);return;}
          if(i>=lib.urls.length){done(false);return;}
          var s=document.createElement("script");
          s.src=lib.urls[i++];
          s.onload=function(){lib.check()?done(true):attempt();};
          s.onerror=attempt;
          document.head.appendChild(s);
        }
        attempt();
      }
      function chain(idx){
        if(idx>=LIBS.length){
          // All loaded. Run the babel script block.
          try{ window.Babel.transformScriptTags(); }
          catch(e){ showFail("Babel failed to process the app: "+e.message); }
          return;
        }
        loadOne(LIBS[idx],function(ok){
          if(!ok){ showFail("Could not load "+LIBS[idx].name+" from any source. Check your internet connection and reload."); return; }
          chain(idx+1);
        });
      }
      function showFail(msg){
        document.getElementById("root").innerHTML=
          '<div style="padding:40px 24px;font-family:-apple-system,system-ui,sans-serif;max-width:420px;margin:0 auto">'+
          '<div style="font-size:18px;font-weight:900;color:#2a2118;margin-bottom:8px">Could not start</div>'+
          '<div style="font-size:13px;color:#666;line-height:1.5;margin-bottom:16px">Your data is safe and untouched. This is a network or loading problem, not your information.</div>'+
          '<div style="font-size:11px;color:#b45309;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px;margin-bottom:16px">'+msg+'</div>'+
          '<button onclick="location.reload()" style="width:100%;background:#2a2118;color:#fff;border:none;border-radius:10px;padding:14px;font-size:12px;font-weight:800">Reload</button></div>';
      }
      chain(0);
    })();
  </script>

// "skip" means "I looked, and no". It is a mark for his eye only: everywhere a number
// is produced it behaves EXACTLY like an empty cell. That is what cellCounts guards.
//
// Order: done is still one tap, because it is the commonest action by far. skip is the
// second tap, because it is the second commonest. box, deep and back sit behind them.
const STATES = [null, "x", "skip", "box", "deep", "back"];

// THE test for "does this cell count towards anything". Every score, streak, counter,
// tracking goal and export total goes through it. A bare truthy check would count a
// skip as done and quietly inflate every number in the app.
function cellCounts(st){ return !!st && st!=="skip"; }
// How much a cell is worth where boxing doubles. Same guard, one place.
function cellWeight(st){ return st==="box"?2:(cellCounts(st)?1:0); }
function nextSt(cur) { return STATES[(STATES.indexOf(cur)+1)%STATES.length]; }
function stMark(st, col) {
  if (!st)           return { ch:"·", c:"#ddd", fw:400, fs:10 };
  if (st === "x")    return { ch:"×", c:col,    fw:900, fs:13 };
  if (st === "box")  return { ch:"⊠", c:col,    fw:900, fs:12 };
  if (st === "deep") return { ch:"■", c:"#111",  fw:900, fs:11 }; // Deep Work session
  if (st === "back") return { ch:"◀", c:col,    fw:900, fs:11 };
  if (st === "skip") return { ch:"", c:"#b9b2a6", fw:400, fs:10, rule:true }; // a drawn line, see cellRule
  return               { ch:"·", c:"#ddd", fw:400, fs:10 };
}

// The "not done" mark. A line across an otherwise untouched white cell: nothing is
// filled in, because nothing was done. One definition, used by all three grids.
function cellRule(color){

}

// (T1/T2/T3 checkboxes), out of a fixed denominator of 3. Q2 days keep the original
// HAT-mark logic (PW/PB/PA marked in the grid) so past numbers never change.
function isQ3Day(m,d){ return (m*100+d)>=706; }

// Two Q3 habits are stored under their pre-Q3 code: RJ1 writes to the old RJ, and
// PB2 writes to the old PB. The grid already shows them by their real names through
// the disp field, but the exports printed the raw stored code, so a week export said
// PB when he means PB2. This is the ONE function that turns a stored code into the
// name he actually uses, and every export now calls it.
//
// Scoped to Q3 on purpose. Before Q3, PB was the Behaviour pillar and RJ was one
// undivided journal habit, so relabelling those days would rewrite his own history.
// A pre-Q3 day still exports as PB and RJ, which is what it meant at the time.
const HAT_DISP_Q3={RJ:"RJ1",PB:"PB2"};
function hatLabel(code,m,d){
  if(m!==undefined&&d!==undefined&&!isQ3Day(m,d)) return code;
  return HAT_DISP_Q3[code]||code;
}
function readTaskChecksLS(){ try{const v=localStorage.getItem("lifeos_v8_taskChecks");return v?JSON.parse(v):{};}catch(e){return {};} }
// From Q3 on, the Top 3 are weighted: T1 carries 60%, T2 and T3 carry 20% each.
// T1 is the one that moves the quarter, so finishing it is worth more than the rest combined.
const T_WEIGHTS = {t1:60, t2:20, t3:20};
function top3TasksPct(m,d,tcIn){
  const tc=tcIn||readTaskChecksLS();
  let pct=0;
  ["t1","t2","t3"].forEach(s=>{ if(tc[m+"-"+d+"-"+s+"-c"]) pct+=T_WEIGHTS[s]; });
  return pct;
}
function top3pct(data, day, m) {
  if(!data) return 0;
  // When the caller passes the month and it's a Q3 day, use Top 3 tasks.
  if(m!=null && isQ3Day(m,day)) return top3TasksPct(m,day);
  return Math.round(TOP3.filter(h=>cellCounts(data.grid[h.code]?.[day])).length/TOP3.length*100);
}
// Single day's Top 3 / Pillar score as a %. Q3 days score the weighted T1/T2/T3 tasks
// (60/20/20, so 100 only when all three are checked); Q2 days score the three PW/PB/PA
// HAT marks the same way the app always did. counted=false means the day has no data
// at all (an untouched Q2 day) and should be skipped rather than treated as a zero.
// Used by weekRunner (week bar + weekly average) and by streakAsOf below, so there is
// exactly one place that defines what a "day" scores.
function dayScorePct(allData, tc, m, d){
  if(isQ3Day(m,d)) return {pct:top3TasksPct(m,d,tc), counted:true};
  const mi=MONTHS_ARR.findIndex(x=>x.m===m);
  const data=allData[mi];
  if(!data) return {pct:0, counted:false};
  return {pct:Math.round(TOP3.filter(h=>cellCounts(data.grid[h.code]?.[d])).length/TOP3.length*100), counted:true};
}

// Single source of per-day week math. Returns each day's weighted %, the running
// cumulative total (which is where the runner bar plants its day markers) and the
// 0-700 sum. Q3 days use the weighted T1/T2/T3 score, Q2 days keep the original HAT
// math so archived quarters never change.
function weekRunner(allData, wdList){
  const tc=readTaskChecksLS();
  const days=[]; let run=0;
  wdList.forEach(({m,d})=>{
    const {pct,counted}=dayScorePct(allData,tc,m,d);
    run+=pct;
    days.push({m,d,pct,counted,cum:run,past:(m*100+d)<(TODAY_M*100+TODAY_D)});
  });
  return {days,total:run,max:wdList.length*100};
}

// Steps one calendar day backward. Returns null once it would walk before the first
// tracked month (April), which stops streakAsOf from looping forever on old data.
function prevDay(m,d){
  if(d>1) return [m,d-1];
  const idx=MONTHS_ARR.findIndex(x=>x.m===m);
  if(idx<=0) return null;
  const pm=MONTHS_ARR[idx-1];
  return [pm.m,pm.days];
}

// Consecutive-day streak ending at (m,d), per the Master Key's own definition: a day
// counts only when ALL THREE Top 3 / pillar slots are done that day (dayScorePct===100).
// If (m,d) itself is not yet at 100 (still in progress, or simply not done), it does
// NOT count and does NOT break the streak either. Counting starts from the day before
// instead. This is deliberate: copying the export mid-day, before RJ2 closes the day
// out, must never show a broken streak just because today isn't finished yet.
function streakAsOf(allData, m, d){
  const tc=readTaskChecksLS();
  let cur=dayScorePct(allData,tc,m,d).pct===100?[m,d]:prevDay(m,d);
  let n=0;
  while(cur){
    const [cm,cd]=cur;
    if(dayScorePct(allData,tc,cm,cd).pct!==100) break;
    n++;
    cur=prevDay(cm,cd);
  }
  return n;
}

// Simple tap cell. Fires on tap, like a normal button. A slide during touch (scroll)
// cancels the mark so scrolling the grid won't toggle, but any deliberate tap registers
// instantly with no hold time.
function HoldCell({onHold,style,title,children}){
  const sx=React.useRef(0);const sy=React.useRef(0);const moved=React.useRef(false);const handled=React.useRef(false);
  const slid=(x,y)=>(Math.abs(x-sx.current)>16||Math.abs(y-sy.current)>16);
  return (
    <div style={{...style,userSelect:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none",touchAction:"pan-y",cursor:"pointer"}} title={title}
      onTouchStart={e=>{const c=e.touches[0];sx.current=c.clientX;sy.current=c.clientY;moved.current=false;}}
      onTouchMove={e=>{const c=e.touches[0];if(slid(c.clientX,c.clientY))moved.current=true;}}
      onTouchEnd={e=>{if(!moved.current){e.preventDefault();handled.current=true;onHold();setTimeout(()=>{handled.current=false;},400);}}}
      onTouchCancel={()=>{moved.current=true;}}
      onClick={()=>{if(!handled.current)onHold();}}
      onContextMenu={e=>e.preventDefault()}>
      {children}
    </div>
  );
}

// ── TOP 3 TASKS ─────────────────────────────────────────────────────────────
// One shared component rendered by BOTH the Today tab and the Plan tab.
// All of its state lives in App, so the two tabs are always the same board:
// edit, check, carry or reorder in one and the other shows it immediately.
// THE test for whether a task slot holds anything. Strips the zero-width space first:
// "\u200b".trim() is NOT empty in JavaScript, so a bare .trim() counts an invisible
// character as a real task. Everything that asks "is this slot filled" calls this.
// Task text aliases. A task is only text in a slot, so rewording it breaks any match
// against previous days. This remembers "this wording used to be that wording" so the
// carry streak survives a typo fix. Only written when the old wording actually had a
// streak, which means typing something new never touches it.
const TASK_ALIAS_KEY="lifeos_taskAliases26";
const TASK_ALIAS_CAP=250;
function readTaskAliases(){
  try{ const v=localStorage.getItem(TASK_ALIAS_KEY); return v?JSON.parse(v):{}; }catch(e){ return {}; }
}
function rootTextKey(aliases,key){
  const a=aliases&&aliases[key];
  return (a&&a.root)||key;   // one hop only, never a chain
}
function recordTaskAlias(oldKey,newKey){
  if(!oldKey||!newKey||oldKey===newKey) return;
  const a=readTaskAliases();
  // Point straight at the original wording, so ten keystrokes do not build ten hops.
  const root=rootTextKey(a,oldKey);
  if(root===newKey){ return; }
  a[newKey]={root,at:Date.now()};
  const keys=Object.keys(a);
  if(keys.length>TASK_ALIAS_CAP){
    keys.sort((x,y)=>(a[x].at||0)-(a[y].at||0))
        .slice(0,keys.length-TASK_ALIAS_CAP)
        .forEach(k=>{delete a[k];});
  }
  lsWrite(TASK_ALIAS_KEY,JSON.stringify(a));
}

// the screen still showed it, and it was gone on the next reload with no warning at any
// point. That is the worst failure this app can have. Now a failure is reported once,
// loudly, while the text is still on screen and can be exported.
// One value for every drag handle in the app: how long a finger must stay put before
// a row is picked up. Below this a scroll starts a reorder; far above it the list
// feels stuck. Declared here, above every component that reads it.
const HOLD_MS=180;

let _lsWriteFailed=false;
function lsWrite(key,val){
  try{
    localStorage.setItem(key, typeof val==="string"?val:JSON.stringify(val));
    return true;
  }catch(e){
    if(!_lsWriteFailed){
      _lsWriteFailed=true;
      try{ alert("This device refused to save.\n\nWhat you just typed is still on screen but WILL BE LOST if you reload or close the app.\n\nOpen Atlas and export a backup now, then free up storage space."); }catch(_){}
    }
    return false;
  }
}

function slotFilled(v){ return !!(v||"").replace(/\u200b/g,"").trim(); }
function slotText(v){ return (v||"").replace(/\u200b/g,"").trim(); }

function Top3Tasks({allData,getMI,viewM,viewDay,setTask,appendTask,taskChecks,saveTaskChecks,taskSlotsMap,saveTaskSlotsMap,escalations,saveEscalations,onAllDone}) {
  const [escOpen,setEscOpen]=useState(false);
  const dragIdxRef=useRef(null);
  const dragOverIdxRef=useRef(null);
  // HOLD-TO-DRAG. A drag used to begin on the first touch, so a thumb that landed on
  // the handle while scrolling reordered the day. The row is only picked up after
  // HOLD_MS with no movement; any movement before that kills the gesture entirely.
  const holdTimerRef=useRef(null);
  const holdPendingRef=useRef(null);
  const [draggingSlot,setDraggingSlot]=useState(null);
  // Where the dragged row will land. A ref alone cannot repaint, so the drop target
  // was invisible and the drag felt like guessing.
  const [dragOverSlot,setDragOverSlot]=useState(null);
  const rowRefsArr=useRef([]);

  const getSlotCount=(m,d,tasks)=>{let filled=0;if(tasks){for(let s=1;s<=10;s++){if(slotFilled(tasks["t"+s]))filled=s;}}return Math.max(3,filled,taskSlotsMap[m+"-"+d]||3);};
  const addTaskSlot=(m,d)=>{const cur=getSlotCount(m,d);if(cur<10)saveTaskSlotsMap({...taskSlotsMap,[m+"-"+d]:cur+1});};

  const escKey=(text)=>(text||"").replace(/\u200b/g,"").trim().toLowerCase();
  const isEscalated=(text)=>{const k=escKey(text);return !!(k&&escalations[k]);};
  // Rewrite a task's text AND carry its escalation flag across to the new wording.
  // Called on every keystroke, so it does nothing at all unless the old text actually
  // held a flag, which is the rare case.
  const setTaskKeepingFlags=(m,d,slot,nextVal)=>{
    const prev=slotText(allData[getMI(m)]?.tasks?.[d]?.[slot]);
    // Before the text changes, note whether this task had a run going. Only then is an
    // alias worth storing: typing something brand new has no streak and writes nothing.
    if(prev&&slotText(nextVal)&&carryStreak(m,d,prev)>0){
      recordTaskAlias(prev.toLowerCase(),slotText(nextVal).toLowerCase());
    }
    setTask(m,d,slot,nextVal);
    const oldK=escKey(prev);
    if(!oldK||!escalations[oldK]) return;      // nothing was flagged, nothing to move
    const newK=escKey(nextVal);
    const next={...escalations};
    if(oldK===newK){
      // Only the casing or spacing moved, so the key is unchanged, but the label shown
      // in the Escalated card is the stored text and it must follow what he typed.
      const shown=slotText(nextVal);
      if(next[oldK].text===shown) return;
      next[oldK]={...next[oldK],text:shown};
      saveEscalations(next);
      return;
    }
    delete next[oldK];
    // Emptying the box is not the same as deleting the row, but there is no longer any
    // text for the flag to belong to, so it goes. The row's own delete button also
    // clears it, and that is the deliberate way to drop one.
    if(newK) next[newK]={...escalations[oldK],text:slotText(nextVal)};
    saveEscalations(next);
  };

  const toggleEscalation=(text)=>{
    const k=escKey(text);if(!k) return;
    const next={...escalations};
    if(next[k]) delete next[k]; else next[k]={text:(text||"").replace(/\u200b/g,"").trim(),since:TODAY_M+"-"+TODAY_D};
    saveEscalations(next);
  };

  const isTaskChecked=(m,d,slot)=>!!(taskChecks[m+"-"+d+"-"+slot+"-c"]);
  const isCarried=(m,d,slot)=>!!(taskChecks[m+"-"+d+"-"+slot+"-r"]);
  const toggleTaskCheck=(m,d,slot)=>{
    const key=m+"-"+d+"-"+slot+"-c";
    const cur=taskChecks[key]||false;
    const next={...taskChecks,[key]:!cur};
    saveTaskChecks(next);
    if(!cur&&m===viewM&&d===viewDay&&onAllDone){
      const allNowDone=["t1","t2","t3"].every(s=>s===slot?true:!!(next[m+"-"+d+"-"+s+"-c"]));
      if(allNowDone) setTimeout(onAllDone,120);
    }
  };
  // Order matters here. The old version saved the red flag FIRST and only then tried
  // to move the task, so four different paths (no next day, month table exhausted,
  // destination already holds the same text, destination full) could return leaving
  // the flag ON with nothing carried. Tapping again just toggled the flag off and on
  // while nothing ever moved. Now nothing is committed until the move has succeeded,
  // and every path that cannot move says why. Nothing is ever deleted on either day.
  const toggleCarry=(m,d,slot)=>{
    const key=m+"-"+d+"-"+slot+"-r";
    const carrying=!taskChecks[key];
    const task=slotText(allData[getMI(m)]?.tasks?.[d]?.[slot]);
    // Un-carrying only clears the red flag. It NEVER deletes anything on the next day.
    if(!carrying){ saveTaskChecks({...taskChecks,[key]:false}); return; }
    if(!task) return; // nothing to carry
    // Resolve the destination day before touching any state.
    const mI=MONTHS_ARR.find(x=>x.m===m);
    let nm=m,nd=d+1;
    if(mI&&nd>mI.days){
      const ni=getMI(m)+1;
      if(ni>=MONTHS_ARR.length){ alert("There is no next day after "+(M_LABEL[m]||m)+" "+d+" in the tracked months. Nothing was changed."); return; }
      nm=MONTHS_ARR[ni].m; nd=1;
    }
    if(getMI(nm)<0){ alert("The next day falls outside the tracked months. Nothing was changed."); return; }
    const destTasks=allData[getMI(nm)]?.tasks?.[nd]||{};
    const slotKeys=Array.from({length:10},(_,i)=>"t"+(i+1));
    const already=slotKeys.some(sk=>slotText(destTasks[sk])===task);
    if(already){
      // It really is on the next day, so the flag is telling the truth. Set it and say
      // so, rather than doing nothing and leaving him tapping a button that looks dead.
      saveTaskChecks({...taskChecks,[key]:true});
      alert("Already on "+(M_LABEL[nm]||nm)+" "+nd+". Marked as carried, nothing was duplicated.");
      return;
    }
    const filledCount=slotKeys.filter(sk=>slotFilled(destTasks[sk])).length;
    if(filledCount>=10){
      // The day is at capacity. Do NOT set the carry flag: nothing moved, and a flag
      // saying otherwise is what made tasks look carried while sitting nowhere.
      const k=escKey(task);
      const alreadyEsc=!!(k&&escalations[k]);
      const msg=(M_LABEL[nm]||nm)+" "+nd+" is full: all 10 rows are taken (T1-T3 plus 7 backlog rows).\n\n"
        +(alreadyEsc
          ? "This task is already flagged as ESCALATED, so it stays visible. Delete a row on "+(M_LABEL[nm]||nm)+" "+nd+" with the \u2715 button, then carry it again."
          : "OK: flag it as ESCALATED so it stays visible and is not lost.\nCancel: change nothing, then delete a row on "+(M_LABEL[nm]||nm)+" "+nd+" with the \u2715 button and carry it again.");
      if(alreadyEsc){ alert(msg); return; }
      if(confirm(msg)&&k) saveEscalations({...escalations,[k]:{text:task,since:TODAY_M+"-"+TODAY_D}});
      return;
    }
    // appendTask NEVER overwrites: it fills the first free slot and skips exact duplicates.
    appendTask(nm,nd,task);
    saveTaskChecks({...taskChecks,[key]:true});
  };
  const carryStreak=(m,d,text)=>{
    const t=slotText(text);
    if(!t) return 0;
    // Match today's wording OR the wording it was edited from, so fixing a typo does
    // not reset a counter that has been running for days.
    const aliases=readTaskAliases();
    const k=t.toLowerCase();
    const root=rootTextKey(aliases,k);
    const accept=root===k?[k]:[k,root];
    let count=0,cm=m,cd=d;
    for(let back=0;back<14;back++){
      cd--;
      if(cd<1){const pi=MONTHS_ARR.findIndex(x=>x.m===cm)-1;if(pi<0)break;cm=MONTHS_ARR[pi].m;cd=MONTHS_ARR[pi].days;}
      const dayTasks=allData[getMI(cm)]?.tasks?.[cd]||{};
      const found=Object.keys(dayTasks).some(kk=>accept.includes(slotText(dayTasks[kk]).toLowerCase()));
      if(found) count++; else break;
    }
    return count;
  };
  // Auto-escalate: a task carried forward (same exact text, unbroken chain) for 3 or
  // more consecutive days gets flagged automatically, so a stuck task can't quietly
  // keep sliding forward without ever becoming visible. Scoped to the day/task-text
  // actually changing, never to escalations itself, so this can never loop. If the
  // task is no longer sitting in today's list (moved to Brainstorm, deleted, done),
  // there's simply nothing here to check, matching "unless I already moved it myself."
  const todayTasksKey=JSON.stringify(allData[getMI(viewM)]?.tasks?.[viewDay]||{});
  useEffect(()=>{
    const today=allData[getMI(viewM)]?.tasks?.[viewDay]||{};
    const toAdd={};
    Object.keys(today).forEach(slot=>{
      const text=(today[slot]||"").replace(/\u200b/g,"").trim();
      if(!text) return;
      const k=escKey(text);
      if(!k||escalations[k]) return;
      if(carryStreak(viewM,viewDay,text)>=3) toAdd[k]={text,since:TODAY_M+"-"+TODAY_D};
    });
    if(Object.keys(toAdd).length) saveEscalations({...escalations,...toAdd});
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[viewM,viewDay,todayTasksKey]);

        const data = allData[getMI(viewM)];
        const tasks = data?.tasks?.[viewDay]||{};
        const totalSlots = getSlotCount(viewM,viewDay,tasks);
        const slots = Array.from({length:totalSlots},(_,i)=>"t"+(i+1));
        const total = slots.filter(s=>slotFilled(tasks[s])).length;
        const done  = slots.filter(s=>slotFilled(tasks[s])&&isTaskChecked(viewM,viewDay,s)).length;
        const allDone = total>=3&&done===total;

        const moveSlot=(from,to)=>{
          if(from===to) return;
          // Snapshot every slot of THIS day: text + done + carried move together
          const snap=slots.map(s=>({
            text:tasks[s]||"",
            chk:isTaskChecked(viewM,viewDay,s),
            car:isCarried(viewM,viewDay,s),
          }));
          const arr=[...snap];
          const [moved]=arr.splice(from,1);
          arr.splice(to,0,moved);
          // Write back: texts via setTask (functional updates), checks in one batch
          const next={...taskChecks};
          arr.forEach((st,i)=>{
            const slot=slots[i];
            if((tasks[slot]||"")!==st.text) setTask(viewM,viewDay,slot,st.text);
            const kC=viewM+"-"+viewDay+"-"+slot+"-c";
            const kR=viewM+"-"+viewDay+"-"+slot+"-r";
            if(st.chk) next[kC]=true; else delete next[kC];
            if(st.car) next[kR]=true; else delete next[kR];
          });
          saveTaskChecks(next);
        };
        // Remove a row entirely and pull everything below it up one place, so no empty
        // slot is ever stranded in the middle. Check and carry flags move with their
        // rows, exactly as they do in moveSlot. Only this day is touched: the same task
        // sitting on any other day is untouched, and so is its carry streak, which is
        // matched on the task TEXT, not on which slot it happens to occupy.
        const deleteSlot=(idx)=>{
          const raw=slotText(tasks[slots[idx]]);
          const wasEsc=raw&&isEscalated(raw);
          const msg=raw
            ? "Delete this task?\n\n"+(raw.length>70?raw.slice(0,70)+"...":raw)+"\n\nThe row is removed and the rows below move up. No other day is changed."
              +(wasEsc?"\n\nIt will also lose its ESCALATED flag.":"")
            : "Remove this empty row?";
          if(!confirm(msg)) return;
          if(wasEsc){ const k=escKey(raw); const nx={...escalations}; delete nx[k]; saveEscalations(nx); }
          const snap=slots.map(sl=>({
            text:tasks[sl]||"",
            chk:isTaskChecked(viewM,viewDay,sl),
            car:isCarried(viewM,viewDay,sl),
          }));
          snap.splice(idx,1);
          snap.push({text:"",chk:false,car:false}); // the last row empties out
          const next={...taskChecks};
          slots.forEach((sl,i)=>{
            const st=snap[i];
            if((tasks[sl]||"")!==st.text) setTask(viewM,viewDay,sl,st.text);
            const kC=viewM+"-"+viewDay+"-"+sl+"-c";
            const kR=viewM+"-"+viewDay+"-"+sl+"-r";
            if(st.chk) next[kC]=true; else delete next[kC];
            if(st.car) next[kR]=true; else delete next[kR];
          });
          saveTaskChecks(next);
          // Give the freed slot back, never dropping below the three fixed rows.
          const cur=getSlotCount(viewM,viewDay,tasks);
          saveTaskSlotsMap({...taskSlotsMap,[viewM+"-"+viewDay]:Math.max(3,cur-1)});
        };
        const onDragStart=(i)=>{dragIdxRef.current=i;setDraggingSlot(i);};
        const onDragEnter=(i)=>{dragOverIdxRef.current=i;setDragOverSlot(i);};
        const onDragEnd=()=>{
          if(dragIdxRef.current!==null&&dragOverIdxRef.current!==null&&dragIdxRef.current!==dragOverIdxRef.current){
            moveSlot(dragIdxRef.current,dragOverIdxRef.current);
          }
          dragIdxRef.current=null;dragOverIdxRef.current=null;setDraggingSlot(null);setDragOverSlot(null);
        };
        const clearHold=()=>{ if(holdTimerRef.current){clearTimeout(holdTimerRef.current);holdTimerRef.current=null;} holdPendingRef.current=null; };
        const onTouchStart=(i,e)=>{
          clearHold();
          holdPendingRef.current=i;
          holdTimerRef.current=setTimeout(()=>{
            holdTimerRef.current=null;
            const idx=holdPendingRef.current;
            if(idx===null||idx===undefined) return;
            dragIdxRef.current=idx;dragOverIdxRef.current=idx;setDraggingSlot(idx);setDragOverSlot(idx);
          },HOLD_MS);
        };
        const onTouchMove=(e)=>{
          // Moved before the hold landed: this was a scroll, not a drag. Drop it.
          if(dragIdxRef.current===null){ clearHold(); return; }
          // preventDefault is a no-op here (React binds touchmove passively), so the
          // handle carries touchAction:"none" instead. That is what actually stops the
          // page scrolling, which is why the handle must be big enough to land on.
          const y=e.touches[0].clientY;
          let closest=dragIdxRef.current,minDist=Infinity;
          rowRefsArr.current.forEach((ref,ri)=>{
            if(!ref) return;
            const rect=ref.getBoundingClientRect();
            const dist=Math.abs(y-(rect.top+rect.height/2));
            if(dist<minDist){minDist=dist;closest=ri;}
          });
          if(closest!==dragOverIdxRef.current){
            dragOverIdxRef.current=closest;
            setDragOverSlot(closest); // repaint only when the target actually changes
          }
        };
        const onTouchEnd=()=>{ clearHold(); if(dragIdxRef.current!==null) onDragEnd(); };

        return (
          <React.Fragment>
          <div style={{background:"#fff",borderRadius:16,border:"1px solid #f0ebe2",marginBottom:12,overflow:"hidden",boxShadow:"0 3px 16px rgba(42,33,24,0.06)"}}>
            <div style={{padding:"9px 14px",background:"linear-gradient(135deg,#332817,#241c12)",display:"flex",alignItems:"center",gap:8}}>
              <span style={{width:6,height:6,borderRadius:"50%",background:"#c9a96e",flexShrink:0,boxShadow:"0 0 8px rgba(201,169,110,0.6)"}}/>
              <span style={{fontSize:8,letterSpacing:1.8,color:"#fff",fontWeight:800}}>TOP 3 TASKS</span>
              <span style={{flex:1}}/>
              <span style={{fontSize:8,letterSpacing:1,color:"#b0a698",fontWeight:700}}>{M_LABEL[viewM]} {viewDay}</span>
            </div>
            {slots.map((slot,idx)=>{
              const val=tasks[slot]||"";
              const checked=isTaskChecked(viewM,viewDay,slot);
              const carried=isCarried(viewM,viewDay,slot);
              const isExtra=idx>=3;
              const isDraggingThis=draggingSlot===idx;
              const isDropTarget=draggingSlot!==null&&dragOverSlot===idx&&dragOverSlot!==draggingSlot;
              const hasText=slotFilled(val);   // needed by the tick/carry column below
              const rowBg=isDraggingThis?"#f0f4ff":checked?"#f0fdf4":carried?"#fff5f5":"#fff";
              return (
                <React.Fragment key={slot}>
                {idx===3&&(
                  <div style={{display:"flex",alignItems:"center",gap:8,padding:"5px 12px",background:"#faf9f7",borderBottom:"1px solid #ece8e2"}}>
                    <span style={{fontSize:7,fontWeight:900,color:"#7a6f63",letterSpacing:2}}>BACKLOG</span>
                    <span style={{flex:1,height:1,background:"#ece8e2"}}/>
                    <span style={{fontSize:7,color:"#7a6f63",fontWeight:700,letterSpacing:1}}>NOT COMMITMENTS</span>
                  </div>
                )}
                <div ref={el=>rowRefsArr.current[idx]=el}
                  draggable onDragStart={()=>onDragStart(idx)} onDragEnter={()=>onDragEnter(idx)}
                  onDragEnd={onDragEnd} onDragOver={e=>e.preventDefault()}
                  style={{display:"flex",alignItems:"flex-start",borderBottom:"1px solid #e8e8e8",padding:"7px 6px",gap:6,background:rowBg,borderLeft:isExtra?"3px solid #7c3aed":"none",minHeight:50,opacity:isDraggingThis?0.4:1,boxShadow:isDropTarget?"inset 0 3px 0 0 #4338ca":"none",transition:"box-shadow .12s"}}
                >
                  <div onTouchStart={e=>onTouchStart(idx,e)} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
                    title="Hold and drag to reorder"
                    style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"grab",flexShrink:0,width:36,minHeight:46,alignSelf:"stretch",borderRadius:8,background:isDraggingThis?"#e0e7ff":"transparent",touchAction:"none",userSelect:"none",WebkitUserSelect:"none",WebkitTapHighlightColor:"transparent"}}>
                    {idx<3&&<span style={{fontSize:8,fontWeight:900,color:"#7a5f33",lineHeight:1,marginBottom:3,letterSpacing:0.3,paddingLeft:0.3}}>T{idx+1}</span>}
                    <span style={{fontSize:17,color:isDraggingThis?"#4338ca":"#7a6f63",lineHeight:1}}>⠿</span>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0,alignItems:"center"}}>
                    <button onClick={()=>toggleTaskCheck(viewM,viewDay,slot)}
                      title={checked?"Done":"Mark done"}
                      style={{width:28,height:28,borderRadius:6,border:"2px solid "+(checked?"#16a34a":"#ddd"),background:checked?"#16a34a":"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>
                      {checked&&<span style={{fontSize:13,color:"#fff",fontWeight:900,lineHeight:1}}>✓</span>}
                    </button>
                    {(hasText||carried)?(
                      <button onClick={()=>toggleCarry(viewM,viewDay,slot)}
                        title={carried?"Carried to the next day":"Carry to the next day"}
                        style={{width:28,height:28,borderRadius:6,border:"1.5px solid "+(carried?"#ef4444":"#e0e0e0"),background:carried?"#fee2e2":"#f5f5f5",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,fontSize:14,color:carried?"#ef4444":"#a9a196",touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>→</button>
                    ):<span style={{height:28}}/>}
                  </div>
                  <textarea value={val} rows={1}
                    ref={el=>{if(el){el.style.height="auto";el.style.height=Math.max(el.scrollHeight,34)+"px";}}}
                    onChange={ev=>{setTaskKeepingFlags(viewM,viewDay,slot,ev.target.value.replace(/\n/g,""));ev.target.style.height="auto";ev.target.style.height=Math.max(ev.target.scrollHeight,34)+"px";}}
                    onKeyDown={ev=>{if(ev.key==="Enter")ev.preventDefault();}}
                    placeholder={isExtra?"Extra task...":"Task "+(idx+1)+"..."}
                    style={{flex:1,background:"none",border:"none",fontSize:13,fontFamily:"inherit",color:checked?"#9ca3af":isExtra?"#7c3aed":"#241c12",padding:"8px 0",outline:"none",textDecoration:"none",minWidth:0,resize:"none",lineHeight:1.3,overflowY:"auto",display:"block"}}
                  />
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
                    <div style={{display:"grid",gridTemplateColumns:"30px 30px",gap:4,flexShrink:0}}>
                      <button onClick={()=>deleteSlot(idx)}
                        title={hasText?"Delete this task":"Remove this empty row"}
                        style={{width:30,height:28,borderRadius:6,border:"1.5px solid #e8e8e8",background:"#fafafa",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,fontSize:12,color:"#7a6f63",touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>✕</button>
                      {hasText?(
                        <button onClick={()=>toggleEscalation(val)}
                          title={isEscalated(val)?"Escalated, flagged":"Flag as escalated"}
                          style={{width:30,height:28,borderRadius:6,border:"1.5px solid "+(isEscalated(val)?"#e11d48":"#e8e8e8"),background:isEscalated(val)?"#fff1f2":"#fafafa",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,fontSize:12,touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>
                          <span style={{opacity:isEscalated(val)?1:0.32}}>⚡</span>
                        </button>
                      ):<span/>}
                      {(()=>{
                        // Days this exact text has repeated. Tapping promotes it to T1.
                        // Shares the escalate button's red, because both mean the same
                        // thing: this one has been sitting too long.
                        const cs=carryStreak(viewM,viewDay,val);
                        if(cs<2||checked||!hasText) return <span/>;
                        const isPromotable=idx>0;
                        return (
                          <button onClick={()=>{if(isPromotable) moveSlot(idx,0);}}
                            title={isPromotable?"Carried "+(cs+1)+" days. Tap to promote to T1":"Carried "+(cs+1)+" days. This is already your oldest task"}
                            style={{width:30,height:28,borderRadius:6,border:"1.5px solid #e11d48",background:"#fff1f2",cursor:isPromotable?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",padding:0,fontFamily:"inherit",touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>
                            <span style={{fontSize:8,fontWeight:900,color:"#9f1239"}}>{cs+1}d</span>
                          </button>
                        );
                      })()}
                    </div>

                  </div>
                </div>
                </React.Fragment>
              );
            })}
            <div style={{padding:"8px 10px",background:allDone?"#f0fdf4":"#fafafa",borderTop:"1px solid #e8e8e8",display:"flex",justifyContent:"flex-end",alignItems:"center",minHeight:16}}>
              {total>0&&<span style={{fontSize:10,fontWeight:900,color:allDone?"#16a34a":done>0?"#555":"#7a6f63"}}>{allDone?"✓✓✓ ALL DONE":`${done}/${total}`}</span>}
            </div>
            {(()=>{
              const atMax=getSlotCount(viewM,viewDay)>=10;
              return (
              <button onClick={()=>{if(!atMax)addTaskSlot(viewM,viewDay);}} disabled={atMax}
                style={{width:"100%",padding:"11px 0",background:allDone?"#f0fdf4":"#faf8f5",border:"none",borderTop:"1px solid #e8e8e8",color:atMax?"#8a8177":"#7a5f33",fontSize:9,fontWeight:800,letterSpacing:1.5,cursor:atMax?"default":"pointer",fontFamily:"inherit",touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>
                {atMax?"ALL 10 SLOTS IN USE":"+ ADD A TASK"}
              </button>
              );
            })()}
          </div>
          {(()=>{
            // ESCALATED - separate collapsible block AFTER Top 3, so the 3 tasks show first.
            const flagged=Object.values(escalations);
            if(!flagged.length) return null;
            const presentToday=new Set(slots.map(s=>(tasks[s]||"").replace(/\u200b/g,"").trim().toLowerCase()));
            const pending=flagged.filter(f=>!presentToday.has((f.text||"").trim().toLowerCase()));
            if(!pending.length) return null;
            const addToTop=(text)=>{
              const t=(text||"").replace(/\u200b/g,"").trim();
              if(!t) return;
              // Snapshot the whole day. Text + done + carried always travel together.
              const snap=slots.map(s=>({text:tasks[s]||"",chk:isTaskChecked(viewM,viewDay,s),car:isCarried(viewM,viewDay,s)}));
              // Trailing EMPTY slots can be reused. Real text is never dropped.
              while(snap.length&&!(snap[snap.length-1].text||"").replace(/\u200b/g,"").trim()) snap.pop();
              if(snap.some(st=>(st.text||"").replace(/\u200b/g,"").trim().toLowerCase()===t.toLowerCase())) return; // already on this day
              const arr=[{text:t,chk:false,car:false},...snap];
              if(arr.length>10){ alert("This day already has 10 tasks. Finish or remove one first - nothing was changed."); return; }
              const next={...taskChecks};
              // Write EVERY item back, including the one pushed off the bottom.
              arr.forEach((st,i)=>{
                const slot="t"+(i+1);
                if((tasks[slot]||"")!==st.text) setTask(viewM,viewDay,slot,st.text);
                const kC=viewM+"-"+viewDay+"-"+slot+"-c",kR=viewM+"-"+viewDay+"-"+slot+"-r";
                if(st.chk) next[kC]=true; else delete next[kC];
                if(st.car) next[kR]=true; else delete next[kR];
              });
              saveTaskChecks(next);
              // Make sure the day shows enough rows to hold what we just wrote.
              if(arr.length>slots.length) saveTaskSlotsMap({...taskSlotsMap,[viewM+"-"+viewDay]:arr.length});
            };
            return (
              <div style={{background:"#fff",borderRadius:16,border:"1px solid #fecdd3",marginBottom:12,overflow:"hidden",boxShadow:"0 3px 16px rgba(220,38,38,0.07)"}}>
                <button onClick={()=>setEscOpen(o=>!o)} style={{width:"100%",display:"flex",alignItems:"center",gap:7,padding:"9px 12px",background:"linear-gradient(135deg,#be123c,#9f1239)",border:"none",cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>
                  <span style={{fontSize:10,lineHeight:1}}>⚡</span>
                  <span style={{fontSize:8,fontWeight:800,color:"#fff",letterSpacing:1.8}}>ESCALATED · NOT IN TODAY'S TOP 3</span>
                  <span style={{background:"rgba(255,255,255,0.9)",color:"#9f1239",borderRadius:10,fontSize:8,fontWeight:900,padding:"1px 7px",lineHeight:1.4}}>{pending.length}</span>
                  <span style={{flex:1}}/>
                  <span style={{fontSize:12,color:"#ffe4e6",transform:escOpen?"rotate(90deg)":"none",transition:"transform .2s",display:"inline-block"}}>▸</span>
                </button>
                {escOpen&&(
                  <div style={{padding:"10px 12px",display:"flex",flexDirection:"column",gap:7}}>
                  <div style={{fontSize:8,color:"#6f665c",lineHeight:1.5,marginBottom:1}}>Sending one to Top 3 does not clear its flag. It just stops showing here while it sits in today's list. Only ✕ removes the flag.</div>
                  {pending.map((f,i)=>(
                    <div key={escKey(f.text)||i} style={{display:"flex",alignItems:"center",gap:8,background:"#fff5f6",borderRadius:12,border:"1px solid #fecdd3",borderLeft:"3px solid #f43f5e",padding:"9px 10px",boxShadow:"0 1px 5px rgba(220,38,38,0.07)"}}>
                      <div style={{flex:1,minWidth:0}}>
                        {f.since&&<div style={{fontSize:7,color:"#9f1239",fontWeight:800,letterSpacing:0.6,marginBottom:2}}>FLAGGED {(M_LABEL[+String(f.since).split("-")[0]]||"")} {String(f.since).split("-")[1]}</div>}
                        <div style={{fontSize:13,color:"#881337",lineHeight:1.4}}>{f.text}</div>
                      </div>
                      <button onClick={()=>addToTop(f.text)} title="Put this at the top of today's Top 3" style={{flexShrink:0,background:"#e11d48",color:"#fff",border:"none",borderRadius:20,padding:"6px 10px",fontSize:8,fontWeight:900,letterSpacing:0.5,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 6px rgba(225,29,72,0.3)",touchAction:"manipulation",lineHeight:1.2}}>→ TOP 3</button>
                      <button onClick={()=>{if(confirm("Remove \""+f.text+"\" from escalated?"))toggleEscalation(f.text);}} title="Remove flag" style={{flexShrink:0,width:28,height:28,borderRadius:"50%",background:"#ffe4e6",border:"none",fontSize:11,color:"#9f1239",cursor:"pointer",padding:0,fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",touchAction:"manipulation"}}>✕</button>
                    </div>
                  ))}
                  </div>
                )}
              </div>
            );
          })()}
          </React.Fragment>
        );
}

// ── WEEK WINS CARD (Today tab) ──────────────────────────────────────────────

function WeekWinsCard({w,weeklyWins,saveWeeklyWins,allData,getMI,weekDays,onClose}){
  // Keeps the page exactly where it was through a state update that can trigger a
  // keyboard-close reflow. Two frames: one lets React commit and the keyboard start
  // closing, the second corrects any late shift once it finishes.
  const holdScroll=(fn)=>{
    const y=window.scrollY;
    fn();
    requestAnimationFrame(()=>{window.scrollTo(0,y);requestAnimationFrame(()=>window.scrollTo(0,y));});
  };
  const key="w"+w.n, fkey="f"+w.n;
  // Fully controlled from the weeklyWins prop, the same way Note and Highlight read
  // straight from allData. No local copy of the text exists, so there is nothing
  // that can go stale and nothing that needs an explicit push to be kept.
  const text=weeklyWins[key]||"";

  const [saved,setSaved]=useState(false);

  const tRef=useRef(null);
  useEffect(()=>()=>{if(tRef.current)clearTimeout(tRef.current);},[]);
  const save=(newText,isFin)=>{
    const next={...weeklyWins};
    const t=(newText||"").trim();
    // The FINAL tick must stick on its own. Previously it was dropped whenever the
    // text was still empty, so ticking it before pasting the list did nothing.
    if(t) next[key]=newText; else delete next[key];
    if(isFin) next[fkey]=true; else delete next[fkey];
    saveWeeklyWins(next);
    setSaved(true); if(tRef.current)clearTimeout(tRef.current);
    tRef.current=setTimeout(()=>setSaved(false),1500);
  };
  // Raw daily notes from the same 7 days, so there is something to build the list from.
  const raw=weekDays().map(({m,d})=>{
    const wins=(allData[getMI(m)]?.wins?.[d]||"").trim();
    return wins?{m,d,wins}:null;
  }).filter(Boolean);
  const days=weekDays();
  const tc=readTaskChecksLS();
  const avg=(()=>{let s=0,n=0;days.forEach(({m,d})=>{s+=top3TasksPct(m,d,tc);n++;});return n?Math.round(s/n):0;})();
  const full=days.filter(({m,d})=>["t1","t2","t3"].every(sl=>tc[m+"-"+d+"-"+sl+"-c"])).length;

        {saved&&<span style={{fontSize:7,fontWeight:800,color:"#86efac",letterSpacing:1}}>SAVED</span>}
        <span style={{fontSize:7,color:"#b0a698",fontWeight:700}}>{w.sm} {w.start[1]} – {w.em} {w.end[1]}</span>
        <span style={{flex:1}}/>
        <button onClick={onClose} style={{background:"#e8c98f",border:"none",color:"#241c12",borderRadius:10,padding:"3px 10px",fontSize:8,fontWeight:800,letterSpacing:1,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>✕ CLOSE</button>
      </div>
      <div style={{padding:"7px 12px",background:"#faf7f3",borderBottom:"1px solid #f0e9da",display:"flex",gap:12,alignItems:"center"}}>
        <span style={{fontSize:7,color:"#6f665c",fontWeight:700,letterSpacing:1}}>AVG <span style={{fontSize:11,fontWeight:900,color:avg>=60?"#15803d":"#8a7f74"}}>{avg}%</span></span>
        <span style={{fontSize:7,color:"#6f665c",fontWeight:700,letterSpacing:1}}>ALL 3 <span style={{fontSize:11,fontWeight:900,color:"#2a2118"}}>{full}/7</span></span>
      </div>
      {/* PROCESSED LIST. This is the full curated weekly wins doc, meant to be pasted
          in as one block and read whole with no scrolling, not a single-win input. It
          used to sit below the raw notes with no header of its own, which read like an
          "add a win" field. It now leads, with its own explicit label. */}
      <div style={{padding:12}}>
        <div style={{fontSize:8,fontWeight:800,letterSpacing:1.8,color:"#8a6d3b",marginBottom:6}}>⭐ WEEKLY WINS · SAVES AS YOU TYPE</div>
        <textarea value={text} onChange={e=>save(e.target.value,fin)}
          ref={el=>{if(el){el.style.height="auto";el.style.height=Math.max(140,el.scrollHeight)+"px";}}}

      {raw.length>0&&(
        <div style={{borderTop:"1px solid #e7e5e4"}}>
          <div style={{padding:"7px 14px",background:"linear-gradient(135deg,#78716c,#57534e)",fontSize:7,fontWeight:900,letterSpacing:1.5,color:"#fff"}}>RAW WINS FROM THIS WEEK</div>

              <span style={{fontSize:10,color:"#5a5145",lineHeight:1.45,whiteSpace:"pre-wrap"}}>{wins}</span>
            </div>
          ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── WEEK RUNNER BAR ──────────────────────────────────────────────────────────
// ONE continuous line for the week, never broken. Light green at the start of the
// week, near-black green by 700. Day markers are laid ON TOP at the position where
// each finished day actually ended, so close marks read as weak days and wide gaps
// as strong ones. A day that closed at 100 plants a GOLD marker instead of white.
// The runner rides the leading edge and is always FULLY visible; at the finish he
// runs clean off the right and leaves a ✓. Nothing loops: he only moves when a
// number moves. Tapping the bar opens the week view.
function WeekRunnerBar({allData, wd, onOpen}){
  const rd=weekRunner(allData, wd);
  const max=rd.max||700;
  const pctW=max>0?Math.min(100, rd.total/max*100):0;
  const finished=max>0&&rd.total>=max;
  // clamped so the emoji never half-clips at the edge; at the finish it leaves entirely
  const runLeft=finished?112:Math.max(3,Math.min(94,pctW));
  return (
    <button onClick={onOpen} title="Week progress: tap to open the week view"
      style={{display:"block",width:"100%",padding:0,border:"none",background:"none",
              fontFamily:"inherit",cursor:"pointer",textAlign:"left",touchAction:"manipulation"}}>
      <div style={{position:"relative",height:20,borderRadius:10,background:"#e7ded1",overflow:"hidden",
                   boxShadow:"inset 0 1px 2px rgba(42,33,24,0.09)"}}>
        <div style={{position:"absolute",left:0,top:0,bottom:0,width:pctW+"%",borderRadius:10,overflow:"hidden",
                     transition:"width .55s cubic-bezier(.22,1,.36,1)"}}>
          <div style={{position:"absolute",left:0,top:0,bottom:0,
                       width:(pctW>0?(100/pctW*100):100)+"%",
                       background:"linear-gradient(90deg,#f0fdf4 0%,#bbf7d0 18%,#4ade80 44%,#16a34a 72%,#052e16 100%)"}}/>
        </div>
        {(()=>{
          // A day that scored 0 lands on the same cumulative point as the day before it,
          // so three quiet days would stack into a single line and read as one day. Space
          // any marker that would land too close to the previous one, and clamp the whole
          // set away from the bar's rounded ends so none of them sits inside the curve.
          const MIN_GAP=1.8; // % of bar width, roughly 6px on a phone: reads as two lines
          const marks=[]; let prev=-99;
          rd.days.slice(0,6).forEach(dd=>{
            if(!dd.past) return;
            let pos=max?(dd.cum/max*100):0;
            if(pos-prev<MIN_GAP) pos=prev+MIN_GAP;
            prev=pos;
            marks.push({key:dd.m+"-"+dd.d,pos,full:dd.pct===100});
          });
          return marks.map(mk=>(
            <div key={mk.key} style={{position:"absolute",top:2,bottom:2,
              left:`clamp(3px, ${mk.pos}%, calc(100% - 5px))`,
              width:mk.full?2:1.5,borderRadius:1,zIndex:2,
              background:mk.full?"#e8c98f":"rgba(255,255,255,0.92)",
              // The line runs from near-white to near-black green, so a single marker colour
              // cannot read across it: plain white vanishes on the light start and gold
              // vanishes on the mid green. The thin dark halo carries the light half, the
              // light core carries the dark half, so every marker stays visible everywhere,
              // including on the sand background when the week has earned nothing yet.
              boxShadow:"0 0 0 0.5px rgba(15,42,25,0.55)"}}/>
          ));
        })()}
        {finished&&<span style={{position:"absolute",right:7,top:"50%",transform:"translateY(-50%)",
          fontSize:11,lineHeight:1,color:"#dcfce7",zIndex:3}}>✓</span>}
        <span style={{position:"absolute",top:"50%",left:runLeft+"%",fontSize:14,lineHeight:1,zIndex:4,
          transform:"translate(-50%,-50%) scaleX(-1)",transition:"left .55s cubic-bezier(.22,1,.36,1)",
          filter:"drop-shadow(0 1px 2px rgba(0,0,0,0.3))"}}>🏃</span>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginTop:4,padding:"0 2px"}}>
        <span style={{fontSize:10.5,fontWeight:800,color:"#241c12",letterSpacing:0.3}}>{rd.total}
          <span style={{fontSize:7,color:"#7a6f63",fontWeight:700}}> / {max}</span></span>
        <span style={{fontSize:7,color:"#7a6f63",letterSpacing:1.2,fontWeight:700}}>WEEK TO {max}</span>
      </div>
    </button>
  );
}

function TodayPanel({allData,getMI,viewDay,viewM,setViewDay,setViewM,weekIdx,setWeekIdx,weekDays,cycleCell,cycleEnergy,cycleMood,setTask,appendTask,setNote,setHighlight,setMoodNote,setWins,weekAssess,setAssess,setPriority,toggleExtraHat,toggleLibHat,winsLogged,toggleWinsLogged,hlChecked,toggleHlChecked,hlStars,cycleHlStars,priChecks,savePriChecks,taskChecks,saveTaskChecks,taskSlotsMap,saveTaskSlotsMap,escalations,saveEscalations,planData}) {
  const data = allData[getMI(viewM)];
  const w = Q2_WEEKS[weekIdx];
  const wd = weekDays();
  const [dayCopied,setDayCopied]=useState(false);
  const [escOpen,setEscOpen]=useState(false);
  const dayPct = top3pct(data, viewDay, viewM);
  const curMood = data?.mood?.[viewDay]||null;
  const curNote = data?.notes?.[viewDay]||"";
  const curHighlight = data?.highlights?.[viewDay]||"";
  const curWins = data?.wins?.[viewDay]||"";
  // Which win row to put the cursor in after a "+ NEW WIN". null means leave focus alone.
  const winFocusRef=useRef(null);
  useEffect(()=>{
    if(winFocusRef.current===null) return;
    const el=document.querySelector('[data-bid="win-'+winFocusRef.current+'"]');
    if(el) el.focus();
    winFocusRef.current=null;
  });
  const curExtra = data?.extraHats?.[viewDay]||[];
  const curLib = data?.libHats?.[viewDay]||[];
  const [showLib,setShowLib]=useState(false);

  // Top 3 slot counts, escalations and task checks live in App now and are shared
  // with the Plan tab. Drag state lives inside Top3Tasks.

  // Week wins: the SAME store Atlas uses. Not a copy, the same key, so the two
  // screens can never disagree about what a week holds.
  const [weekView,setWeekView]=useState(false);
  const [weeklyWins,setWeeklyWins]=useState(readWeeklyWins);
  const saveWeeklyWins=(next)=>{setWeeklyWins(next);lsWrite(WEEKWINS_KEY,JSON.stringify(next));};

  // Key format: "m-d-slot-c" for check, "m-d-slot-r" for carry
  // slot = "t1","t2","t3"... - stays with the slot, not the visual position
  // 🐝 BEE CELEBRATION - canvas overlay when all 3 tasks done
  const beeCanvasRef=useRef(null);
  const beeAnimRef=useRef(null);
  const launchBees=()=>{
    const canvas=beeCanvasRef.current;
    if(!canvas) return;
    canvas.style.display="block";
    const ctx=canvas.getContext("2d");
    const DPR=Math.min(window.devicePixelRatio||1,2);
    const W=window.innerWidth, H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR;
    canvas.style.width=W+"px"; canvas.style.height=H+"px";
    ctx.scale(DPR,DPR);
    const DURATION=2800; // ms - same speed on every screen
    const easeOutCubic=t=>1-Math.pow(1-t,3);
    const easeOutBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
    const CONFETTI_COLORS=["#c9a96e","#f4c430","#ffd966","#e07b54","#7c6aad","#4a9d6f","#ff8fab","#fff1a8"];
    const BEES=Array.from({length:22},()=>({
      x:Math.random()*W,
      y:H+30+Math.random()*90,
      vx:(Math.random()-0.5)*2.6,
      vy:-(3.6+Math.random()*3.4),
      size:18+Math.random()*16,
      wobble:Math.random()*Math.PI*2,
      wobbleSpeed:0.055+Math.random()*0.05,
      born:Math.random()*350, // staggered entrance, ms
    }));
    const origins=[{x:W*0.5,y:H*0.62},{x:W*0.18,y:H*0.72},{x:W*0.82,y:H*0.72}];
    const CONFETTI=[];
    origins.forEach((o,oi)=>{
      for(let i=0;i<30;i++){
        const ang=-Math.PI/2+(Math.random()-0.5)*2.0;
        const spd=5.5+Math.random()*7.5;
        CONFETTI.push({
          x:o.x,y:o.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
          w:5+Math.random()*6,h:8+Math.random()*7,
          color:CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],
          rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.28,
          born:oi*90, // bursts cascade left to right
        });
      }
    });
    const SPARKLES=Array.from({length:18},()=>({
      x:Math.random()*W, y:H*0.18+Math.random()*H*0.6,
      size:9+Math.random()*14,
      phase:Math.random()*Math.PI*2, speed:0.0045+Math.random()*0.004,
    }));
    const t0=performance.now();
    let last=t0;
    const draw=(now)=>{
      const elapsed=now-t0;
      const dt=Math.min((now-last)/16.667,3); last=now; // 60fps-normalized, capped
      const prog=Math.min(elapsed/DURATION,1);
      ctx.clearRect(0,0,W,H);
      // Confetti - physics scaled by dt, gentle fade in last third
      CONFETTI.forEach(c=>{
        if(elapsed<c.born) return;
        c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy+=0.18*dt; c.vx*=Math.pow(0.995,dt); c.rot+=c.vr*dt;
        const a=prog<0.6?1:Math.max(0,1-easeOutCubic((prog-0.6)/0.4));
        ctx.save();ctx.globalAlpha=a;ctx.translate(c.x,c.y);ctx.rotate(c.rot);
        ctx.fillStyle=c.color;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();
      });
      // Sparkles - time-based twinkle
      SPARKLES.forEach(s=>{
        const tw=(Math.sin(s.phase+elapsed*s.speed)+1)/2;
        let a=tw*0.9; if(prog>0.55)a*=Math.max(0,1-(prog-0.55)/0.45);
        ctx.globalAlpha=a;ctx.font=`${s.size}px serif`;ctx.textAlign="center";
        ctx.fillText("✨",s.x,s.y);
      });
      // Bees - staggered entrance, smooth sway, soft fade
      BEES.forEach(b=>{
        if(elapsed<b.born) return;
        b.x+=(b.vx+Math.sin(b.wobble)*1.25)*dt;
        b.y+=b.vy*dt;
        b.wobble+=b.wobbleSpeed*dt;
        b.vy+=0.03*dt;
        const a=prog<0.55?1:Math.max(0,1-easeOutCubic((prog-0.55)/0.45));
        ctx.save();ctx.globalAlpha=a;ctx.translate(b.x,b.y);
        ctx.rotate(Math.sin(b.wobble*0.7)*0.28);
        ctx.font=`${b.size}px serif`;ctx.textAlign="center";
        ctx.fillText("🐝",0,0);ctx.restore();
      });
      // ALL DONE - soft gold glow, ease-out-back pop, gentle float, smooth fade
      if(prog<0.62){

        glow.addColorStop(1,"rgba(201,169,110,0)");

        ctx.shadowBlur=0;
        ctx.font="22px serif";ctx.fillText("🎉",0,34);
        ctx.restore();
      }
      ctx.globalAlpha=1;
      if(elapsed<DURATION) beeAnimRef.current=requestAnimationFrame(draw);
      else { ctx.clearRect(0,0,W,H); canvas.style.display="none"; }
    };

// ── MONTH PANEL ─────────────────────────────────────────────────────────────
const FLAT_HATS = MONTH_SECTIONS.flatMap(s=>s.hats);
// C = cell size px (square). No margins between cols - alignment via borders only.
const C=17, COL_DAY=22, COL_EN=17, COL_MOOD=17, COL_PCT=24;
function moodColor(v) {
  if(!v) return "#ddd";
  if(v>=10) return "#7c3aed"; // 10-11: the rare ones, violet
  if(v>=8)  return "#0d9488"; // 8-9: strong day, deep teal
  if(v>=6)  return "#84b356"; // 6-7: fine but unremarkable, quiet olive green
  if(v>=4)  return "#f9a825";
  if(v>=2)  return "#e65100";
  return "#c62828";
}

// Tracking HATs
const TRK_ALL = [...TRK_PXRV,...TRK_PR,...TRK_RSLH,...TRK_MV,...TRK_SM];
const TRK_DEFAULT_GOALS = {PX:2,RV:1,PR:2,RS:1,LH:2,MV:1,SM:1};

// Group spans: col indices (0-based within HAT columns) for each group
// FLAT_HATS: 0=MS 1=MM 2=RJ 3=RJ2 | 4=PW 5=PB 6=PA | 7=PX 8=RV 9=PR 10=RS 11=LH 12=MV 13=SM
const GROUPS = [
  {label:"ESSENTIALS", start:0, end:3, color:"#bf5000", bg:"#fff3e0", bdr:"#ffb74d"},
  {label:"TOP 3",      start:4, end:6, color:"#1b5e20", bg:"#e8f5e9", bdr:"#66bb6a"},
  {label:"TRACKING",  start:7, end:13, color:"#555",    bg:"#f5f5f5", bdr:"#bbb"},
];

// Build flat meta for each HAT col
function buildSectionMeta() {
  let i=0; const meta=[];
  MONTH_SECTIONS.forEach((sec,si)=>{
    sec.hats.forEach((h,hi)=>{

// Weekly progress for a Tracking code, quarter-aware: Q3 (DT/PR/MV/SM) uses
// Q3_TRK_GOALS, Q2 (PX/RV/PR/RS/LH/MV/SM) uses TRK_DEFAULT_GOALS. Returns the raw
// count for the week (boxing counts as 2 sessions) and whether the target is met.
// FIXES a real bug: the mini grid's gold "goal met" highlight for DT never fired,
// because it checked DT against the Q2 tracking list, which does not contain DT.
// Used by that same highlight AND by the day export's Tracking line, so they agree.
function trkWeekProgress(allData, code, m, d){
  const q3=isQ3Day(m,d);
  const codes=(q3?Q3_TRACKING:TRK_ALL).map(h=>h.code);
  if(!codes.includes(code)) return {count:0,goal:0,met:false};
  const goal=(q3?Q3_TRK_GOALS:TRK_DEFAULT_GOALS)[code]||1;
  const wk=Q2_WEEKS.find(w=>m*100+d>=w.start[0]*100+w.start[1]&&m*100+d<=w.end[0]*100+w.end[1]);
  if(!wk) return {count:0,goal,met:false};
  let cm=wk.start[0],cd=wk.start[1],count=0;
  for(let i=0;i<14;i++){
    const st=allData[_exGMI(cm)]?.grid?.[code]?.[cd];
    count+=cellWeight(st);
    if(cm===wk.end[0]&&cd===wk.end[1]) break;
    cd++;
    const mi=_exGMI(cm);
    if(mi>=0&&cd>MONTHS_ARR[mi].days){const ni=mi+1;if(ni>=MONTHS_ARR.length)break;cm=MONTHS_ARR[ni].m;cd=1;}
  }
  return {count,goal,met:count>=goal};
}

            {DAYS_EXT.map(({m:dm,d:day})=>{

              const wk=getWeekForDay(dm,day);
              const rowBg=isT?"#dbeafe":isSpill?"#fbf7ef":day%2===0?"#f9f9f9":"#fff";

              // Week START banner - shown BEFORE first day of each week (that starts in this month)
              const wkStartW=(()=>{

              // Summary of THIS week shown in its own banner. Uses the SAME weekRunner

              const thisWkSummary=wkStartW?(()=>{

          {(()=>{

            });

                <div onClick={()=>setShowStats(x=>!x)} style={{padding:"7px 10px",background:"#f8f8f8",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:8,fontWeight:800,color:"#555",letterSpacing:2}}>MONTHLY STATS - {month.short}</span>
                  <span style={{fontSize:9,color:"#aaa"}}>{showStats?"▲":"▼"}</span>
                </div>
                {showStats&&(
                  <div style={{padding:"8px 10px"}}>
                    {[{label:"ESSENTIALS",color:"#bf5000",stats:essStats},{label:pillarLabel,color:"#1b5e20",stats:top3Stats},{label:"TRACKING",color:"#555",stats:trkStats}].map(grp=>(

                            <div style={{flex:1,background:"#f0f0f0",borderRadius:20,height:5,overflow:"hidden"}}>

                            </div>
                            <span style={{fontSize:9,fontWeight:700,color:grp.color,minWidth:30,textAlign:"right"}}>{h.filled}d</span>
                            <span style={{fontSize:8,color:"#7a6f63",minWidth:24,textAlign:"right"}}>{h.pct}%</span>
                          </div>
                        ))}
                      </div>
                    ))}
                    <div style={{fontSize:7,color:"#7a6f63",textAlign:"right",paddingTop:4,borderTop:"1px solid #f0f0f0"}}>based on {totalDays} days tracked</div>
                    {/* Extra HATs stats */}
                    {(()=>{
                      const exStats=[...EXTRA_ACTIVE,...LIB_TAGS].map(h=>{
                        const filled=DAYS.filter(d=>((data.extraHats||{})[d]||[]).includes(h.code)||((data.libHats||{})[d]||[]).includes(h.code)).length;
                        return {...h,filled,pct:totalDays>0?Math.round(filled/totalDays*100):0};
                      }).filter(h=>h.filled>0);
                      if(!exStats.length) return null;
                      return (
                        <div style={{marginTop:8,paddingTop:6,borderTop:"2px solid #f0f0f0"}}>

const CHALL_C = 20; // cell size

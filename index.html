function ChallengePanel() {
  const [challData, setChallData] = useState(()=>{
    try{const v=localStorage.getItem(K_CHALLENGE);return v?JSON.parse(v):{}}catch(e){return {};}
  });
  const saveChall=(next)=>{setChallData(next);lsWrite(K_CHALLENGE,JSON.stringify(next));};

  const scrollRef = useRef(null);

  // Toggle a cell (day × item)
  function getChallState(day, itemId){
    const key=`d${day}`;
    const cur=challData[key]||[];
    const entry=cur.find(e=>e===itemId||e.startsWith(itemId+":"));
    if(!entry) return null;
    if(entry===itemId) return "x";
    return entry.split(":")[1]||"x";
  }
  function cycleChallCell(day, itemId){
    const key=`d${day}`;
    const cur=challData[key]||[];
    const st=getChallState(day,itemId);
    // cycle: null → x → back → null
    const nextSt=st===null?"x":st==="x"?"back":null;
    const filtered=cur.filter(e=>e!==itemId&&!e.startsWith(itemId+":"));
    const next=nextSt?[...filtered,itemId+":"+nextSt]:filtered;
    saveChall({...challData,[key]:next});
  }
  function challMark(st){
    if(st==="x") return {ch:"×",color:null}; // color from tc
    if(st==="back") return {ch:"◀",color:"#888"};
    return {ch:"·",color:"#ddd"};
  }

  // Get week number for a May day (weeks relative to Q2_WEEKS)
  function weekForDay(day){return Q2_WEEKS.find(w=>{
    const abs=5*100+day;
    return abs>=w.start[0]*100+w.start[1]&&abs<=w.end[0]*100+w.end[1];
  });}

  // Group items by category for header
  const cats=[...new Set(CHALLENGE_ITEMS.map(i=>i.cat))];
  const DAYS=Array.from({length:CHALLENGE_DAYS},(_,i)=>i+1);
  const totalW=CHALL_COL_DAY+CHALLENGE_ITEMS.length*CHALL_C+2;

  // Build export string for a week
  function buildChallengeExport(weekNum){
    const wk=Q2_WEEKS.find(w=>w.n===weekNum);
    if(!wk) return "";
    let out=`📸 PHOTO CHALLENGE · W${weekNum}\n`;
    DAYS.forEach(d=>{
      const abs=5*100+d;
      if(abs<wk.start[0]*100+wk.start[1]||abs>wk.end[0]*100+wk.end[1]) return;
      const done=(challData[`d${d}`]||[]);
      if(!done.length) return;
      out+=`  MAY ${d}: ${done.map(id=>CHALLENGE_ITEMS.find(i=>i.id===id)?.text||id).join(" | ")}\n`;
    });
    return out;
  }

  const [copied,setCopied]=useState(false);
  const currentWeek=Q2_WEEKS.find(w=>TODAY_M===5&&TODAY_D>=w.start[1]&&TODAY_D<=w.end[1]);

  return (
    <div style={{position:"relative"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <span style={{fontSize:18,fontWeight:900,color:"#2a2118"}}>📸 <span style={{fontSize:8,color:"#7a6f63",fontWeight:700,letterSpacing:2}}>PHOTO CHALLENGE</span></span>
        <span style={{fontSize:9,color:"#aaa"}}>MAY 2026 · 31 DAYS</span>
      </div>

      <div style={{borderRadius:8,border:"1px solid #ddd",overflow:"hidden",marginBottom:8}}>
        <div data-hscroll="true" ref={scrollRef} style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
          <div style={{minWidth:totalW,position:"relative"}}>

            {/* STICKY HEADER */}
            <div style={{position:"sticky",top:0,zIndex:12,background:"#fff",borderBottom:"2px solid #ccc"}}>
              {/* ROW 1: emoji */}
              <div style={{display:"flex",height:16}}>
                <div style={{width:CHALL_COL_DAY,flexShrink:0,background:"#fafafa",borderRight:"1px solid #e0e0e0"}}/>
                {cats.map((cat,ci)=>{
                  const items=CHALLENGE_ITEMS.filter(i=>i.cat===cat);
                  const tc=CHALL_CAT_COLOR[cat]||{color:"#555",bg:"#f5f5f5",bdr:"#bbb"};
                  const emoji=cat.split(" ")[0];
                  return (
                    <div key={ci} style={{
                      width:items.length*CHALL_C,flexShrink:0,height:16,
                      background:tc.bg,
                      borderLeft:`2px solid ${tc.bdr}`,
                      borderTop:`1px solid ${tc.bdr}`,

// ── EXTRA PANEL ───────────────────────────────────────────────────────────────
const EXTRA_ALL_HATS = [...EXTRA_ACTIVE, ...LIB_TAGS];
const EX_C = 22;
const EX_COL_DAY = 28;

// Grey palette for Extra panel
const EX_ACTIVE_GRP = {label:"ACTIVE", color:"#555", bg:"#f5f5f5", bdr:"#bbb"};
const EX_LIB_GRP    = {label:"LIBRARY", color:"#888", bg:"#fafafa", bdr:"#ccc"};

function ExtraPanel({monthIdx, setMonthIdx, allData, toggleExtraHat, toggleLibHat}) {
  const month = MONTHS_ARR[monthIdx];
  const data = allData[monthIdx];
  const DAYS = Array.from({length:month.days},(_,i)=>i+1);
  const isCur = month.m === TODAY_M;
  const scrollRef = useRef(null);

  function getWeekDaysAll(day){
    const w=getWeekForDay(month.m,day); if(!w) return [];
    const pairs=[]; let[cm,cd]=[...w.start]; const[em,ed]=w.end;
    for(let i=0;i<7;i++){
      pairs.push({m:cm,d:cd});
      if(cm===em&&cd===ed) break;
      const mI=MONTHS_ARR.find(x=>x.m===cm);
      if(mI&&cd>=mI.days){
        // Step to the NEXT TRACKED month, not simply cm+1: incrementing blindly walks
        // out of MONTHS_ARR and those days then resolve to index -1 and render blank.
        const ni=MONTHS_ARR.findIndex(x=>x.m===cm)+1;
        if(ni<=0||ni>=MONTHS_ARR.length) break;
        cm=MONTHS_ARR[ni].m; cd=1;
      } else cd++;
    }
    return pairs;
  }
  function getWeekDaysInMonth(day){
    return getWeekDaysAll(day).filter(p=>p.m===month.m).map(p=>p.d);
  }

  function goalMet(code, day){
    const wdays=getWeekDaysAll(day);
    const isExtraA=EXTRA_ACTIVE.some(h=>h.code===code);
    return wdays.some(({m:wm,d:wd})=>{
      const mi=MONTHS_ARR.findIndex(x=>x.m===wm);
      const wdata=allData[mi];
      const ex=(wdata?.extraHats||{})[wd]||[];
      const lb=(wdata?.libHats||{})[wd]||[];
      const arr=isExtraA?ex:lb;
      return arr.some(e=>e===code||e.startsWith(code+":"));
    });
  }

  function getState(code, day){
    // We repurpose extraHats to store the state string for extra panel
    // Format stored: code+":" + state
    const ex=(data.extraHats||{})[day]||[];
    const lb=(data.libHats||{})[day]||[];
    const isExtraA=EXTRA_ACTIVE.some(h=>h.code===code);
    const arr=isExtraA?ex:lb;
    // Check if arr has state entry like "PM:box" or just "PM" (legacy = "x")
    const entry=arr.find(e=>e===code||e.startsWith(code+":"));
    if(!entry) return null;
    if(entry===code) return "x"; // legacy
    return entry.split(":")[1]||"x";
  }

  function cycleExtraState(code, day){
    const isExtraA=EXTRA_ACTIVE.some(h=>h.code===code);
    const cur=getState(code,day);
    const next=nextSt(cur); // null → x → box → back → null
    // Store as "code:state" or remove if null
    const mutFn=(arr)=>{
      const filtered=arr.filter(e=>e!==code&&!e.startsWith(code+":"));
      return next?[...filtered,code+":"+next]:filtered;
    };
    if(isExtraA){
      // use toggleExtraHat logic but we need direct mutation - call parent
      // Since we can't mutData directly, we rebuild using toggleExtraHat trick:
      // Remove old entry first by toggling off if on, then set new
      // Simplest: just call toggleExtraHat which does includes check
      // We need a smarter approach - store state in the code string
      toggleExtraHat(month.m, day, code, next);
    } else {
      toggleLibHat(month.m, day, code, next);
    }
  }

  const totalW = EX_COL_DAY + EXTRA_ALL_HATS.length*EX_C + 2;
  const HDR_GRP=14, HDR_CODE=20;

  return (
    <div style={{position:"relative"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <NBtn onClick={()=>setMonthIdx(x=>Math.max(0,x-1))} on={monthIdx>0}>‹</NBtn>
        <span style={{fontSize:18,fontWeight:900,color:"#2a2118"}}>{month.name} <span style={{fontSize:8,color:"#7a6f63",fontWeight:700,letterSpacing:2}}>EXTRA</span></span>
        <NBtn onClick={()=>setMonthIdx(x=>Math.min(MONTHS_ARR.length-1,x+1))} on={monthIdx<MONTHS_ARR.length-1}>›</NBtn>
      </div>

      <div style={{borderRadius:8,border:"1px solid #ddd",overflow:"hidden"}}>
        <div data-hscroll="true" ref={scrollRef} style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
          <div style={{minWidth:totalW,position:"relative"}}>

            {/* STICKY HEADER */}
            <div style={{position:"sticky",top:0,zIndex:12,background:"#fff",borderBottom:"2px solid #ccc"}}>
              {/* ROW 1: group labels */}
              <div style={{display:"flex",height:HDR_GRP}}>
                <div style={{width:EX_COL_DAY,flexShrink:0}}/>
                <div style={{width:EXTRA_ACTIVE.length*EX_C,flexShrink:0,background:EX_ACTIVE_GRP.bg,borderTop:`1px solid ${EX_ACTIVE_GRP.bdr}`,borderLeft:`2px solid ${EX_ACTIVE_GRP.bdr}`,borderRight:`1px solid ${EX_ACTIVE_GRP.bdr}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7,fontWeight:900,color:EX_ACTIVE_GRP.color,letterSpacing:1}}>ACTIVE</div>
                <div style={{width:LIB_TAGS.length*EX_C,flexShrink:0,background:EX_LIB_GRP.bg,borderTop:`1px solid ${EX_LIB_GRP.bdr}`,borderLeft:`2px solid ${EX_LIB_GRP.bdr}`,borderRight:`1px solid ${EX_LIB_GRP.bdr}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7,fontWeight:900,color:EX_LIB_GRP.color,letterSpacing:1}}>LIBRARY</div>
              </div>
              {/* ROW 2: emoji + code */}
              <div style={{display:"flex",height:HDR_CODE}}>
                <div style={{width:EX_COL_DAY,flexShrink:0}}/>
                {EXTRA_ALL_HATS.map((h,hi)=>{
                  const isFirstLib=hi===EXTRA_ACTIVE.length;
                  const isFirst=hi===0||isFirstLib;
                  const grp=hi<EXTRA_ACTIVE.length?EX_ACTIVE_GRP:EX_LIB_GRP;
                  return (
                    <div key={h.code} style={{
                      width:EX_C,flexShrink:0,height:HDR_CODE,
                      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                      background:grp.bg,
                      borderLeft:`${isFirst?"2":"1"}px solid ${grp.bdr}${isFirst?"":"88"}`,
                      borderBottom:`1px solid ${grp.bdr}`,
                      gap:1,
                    }}>
                      <span style={{fontSize:8,lineHeight:1}}>{h.emoji}</span>
                      <span style={{fontSize:5.5,fontWeight:800,color:grp.color,lineHeight:1}}>{h.code}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* DATA ROWS */}
            {DAYS.map(day=>{
              const isT=isCur&&day===TODAY_D;
              const wk=getWeekForDay(month.m,day);
              const wkStartW=(()=>{
                if(!wk) return null;
                const[sm,sd]=wk.start;
                return (sm===month.m&&sd===day)?wk:null;
              })();
              const rowBg=isT?"#dbeafe":day%2===0?"#f9f9f9":"#fff";
              return (
                <div key={day}>
                  {wkStartW&&(
                    <div style={{display:"flex",alignItems:"center",height:14,background:"#ebebeb",borderTop:"2px solid #333",borderBottom:"1px solid #aaa"}}>
                      <div style={{paddingLeft:4,fontSize:7,fontWeight:900,color:"#222",letterSpacing:1}}>{wkLabel(wkStartW)}</div>
                    </div>
                  )}
                  <div style={{display:"flex",alignItems:"stretch",background:rowBg,borderLeft:isT?"3px solid #1976d2":"3px solid transparent",borderBottom:"1px solid #ebebeb",height:EX_C}}>
                    <div style={{width:EX_COL_DAY-3,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:4,fontSize:10,fontWeight:isT?900:500,color:isT?"#1565c0":"#555"}}>{day}</div>
                    {EXTRA_ALL_HATS.map((h,hi)=>{
                      const isFirstLib=hi===EXTRA_ACTIVE.length;
                      const isFirst=hi===0||isFirstLib;
                      const grp=hi<EXTRA_ACTIVE.length?EX_ACTIVE_GRP:EX_LIB_GRP;
                      const st=getState(h.code,day);
                      const gm=!st&&goalMet(h.code,day);
                      const mk=stMark(st,grp.color);
                      let bg=gm?"#e0e0e0":cellCounts(st)?grp.bg:"transparent";
                      return (
                        <div key={h.code} onClick={()=>cycleExtraState(h.code,day)} style={{
                          width:EX_C,height:EX_C,flexShrink:0,
                          display:"flex",alignItems:"center",justifyContent:"center",
                          cursor:"pointer",background:bg,
                          borderLeft:`${isFirst?"2":"1"}px solid ${gm?"#b0b0b0":isFirst?grp.bdr:"#ccc"}`,
                          borderRight:"1px solid #ccc",
                          borderTop:"1px solid #ccc",
                          borderBottom:"1px solid #ccc",
                          boxSizing:"border-box",
                        }}>
                          {mk.rule?cellRule(mk.c):<span style={{fontSize:mk.fs,fontWeight:mk.fw,lineHeight:1,color:st?grp.color:gm?"#aaa":"#e0e0e0"}}>{mk.ch}</span>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* Legend */}
      <div style={{marginTop:6,background:"#f9f9f9",borderRadius:8,border:"1px solid #e8e8e8",padding:"5px 10px"}}>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
          {[["·","empty","#ccc"],["×","done","#555"],["\u2015","not done","#b9b2a6"],["⊠","boxing","#555"],["◀","back","#888"]].map(([s,l,c])=>(
            <div key={s} style={{textAlign:"center"}}>
              <div style={{fontSize:11,color:c,fontWeight:900}}>{s}</div>
              <div style={{fontSize:7,color:"#7a6f63"}}>{l}</div>
            </div>
          ))}
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{width:9,height:9,borderRadius:2,background:"#e0e0e0",border:"1px solid #bbb"}}/>
            <span style={{fontSize:7,color:"#7a6f63"}}>week goal met</span>
          </div>
          <span style={{fontSize:7,color:"#7a6f63",marginLeft:"auto"}}>ACTIVE 5 + LIBRARY 19 · 1x/week</span>
        </div>
      </div>
    </div>
  );
}

// ── ATLAS SUB-SECTIONS ────────────────────────────────────────────────────────
function AtlasHighlights({allData, setHighlight, setMoodNote, goToDay, onBack}) {
  const [showExp,setShowExp]=useState(false);
  const [editIdx,setEditIdx]=useState(null);
  const [editVal,setEditVal]=useState("");
  const [editMood,setEditMood]=useState("");
  const entries=[];
  MONTHS_ARR.forEach((mo,mi)=>{
    const mdata=allData[mi];
    const maxDay=(mo.m<TODAY_M)?mo.days:(mo.m===TODAY_M?TODAY_D:0);
    if(maxDay===0) return;
    for(let d=1;d<=maxDay;d++){
      const hl=mdata?.highlights?.[d];
      const mv=mdata?.mood?.[d];
      const ev=mdata?.energy?.[d];
      const mn=mdata?.moodNotes?.[d];
      if(hl?.trim()||mn?.trim()||mv||ev) entries.push({mo,mi,d,hl:hl?.trim()||"",mn:mn?.trim()||"",mv,ev});
    }
  });
  const buildExp=()=>{
    let out="✨ HIGHLIGHTS & MOOD - 2026\n"+"=".repeat(36)+"\n\n";
    entries.forEach(({mo,d,hl,mn,mv,ev})=>{
      out+=`${mo.short} ${d}`;
      if(mv) out+=`  mood:${mv}`;
      if(ev) out+=`  energy:${ev}`;
      out+="\n";
      if(hl) out+=`  "${hl}"\n`;
      if(mn) out+=`  mood shift: ${mn}\n`;
      out+="\n";
    });
    return out.trim()||"No entries yet.";
  };
  const startEdit=(i,entry)=>{setEditIdx(i);setEditVal(entry.hl);setEditMood(entry.mn);};
  const saveEdit=(entry)=>{setHighlight(entry.mo.m,entry.d,editVal);setMoodNote(entry.mo.m,entry.d,editMood);setEditIdx(null);};
  return (
    <div>
      <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:8,background:"#f2ede6",border:"none",borderRadius:20,padding:"8px 16px 8px 12px",cursor:"pointer",fontFamily:"inherit",marginBottom:16,boxShadow:"0 2px 8px rgba(0,0,0,0.08)"}}>
        <span style={{fontSize:18,color:"#c9a96e",fontWeight:900,lineHeight:1}}>‹</span>
        <span style={{fontSize:10,fontWeight:800,color:"#2a2118",letterSpacing:2}}>ATLAS</span>
      </button>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:16}}>
        <div>
          <div style={{fontSize:18,fontWeight:900,color:"#b8860b",letterSpacing:-0.5}}>✨ Highlights</div>
          <div style={{fontSize:8,color:"#7a6f63",letterSpacing:2,marginTop:2}}>{entries.length} DAYS LOGGED</div>
        </div>
        <button onClick={()=>{copyText(buildExp());setShowExp(true);setTimeout(()=>setShowExp(false),1800);}} style={{background:showExp?"#16a34a":"#2a2118",color:showExp?"#fff":"#c9a96e",border:"none",borderRadius:20,padding:"7px 14px",fontSize:8.5,letterSpacing:1,cursor:"pointer",fontFamily:"inherit",fontWeight:800,boxShadow:"0 2px 8px rgba(42,33,24,0.18)",whiteSpace:"nowrap"}}>
          {showExp?"✓ COPIED":"⧉ EXPORT HIGHLIGHTS"}
        </button>
      </div>
      {(()=>{
        const moodBand=v=>moodColor(v); // one palette everywhere, and it knows about 11
        const ECOL={"▲▲":"#6d28d9","▲":"#8b5cf6","■":"#16a34a","▼":"#d97706","●":"#9ca3af"};
        const EH={"▲▲":5,"▲":4,"■":3,"▼":2,"●":1};
        const ELAB={"▲▲":"PEAK","▲":"EXC","■":"OK","▼":"UND","●":"REST"};
        const moodAll=entries.filter(e=>e.mv).map(e=>({v:e.mv,m:e.mo.m,key:e.mo.m+"-"+e.d,label:e.mo.short+" "+e.d}));
        const enAll=entries.filter(e=>e.ev).map(e=>({sym:e.ev,m:e.mo.m,key:e.mo.m+"-"+e.d,label:e.mo.short+" "+e.d}));
        const monthAvgs=MONTHS_ARR.map(mo=>{
          const mp=moodAll.filter(p=>p.m===mo.m);
          return mp.length?{short:mo.short,avg:(mp.reduce((s,p)=>s+p.v,0)/mp.length)}:null;
        }).filter(Boolean);

          if(moodAll.length<2) return null;

                <span style={{fontSize:7,color:"#7a6f63",fontWeight:700}}>1-11 daily</span>

                    <stop offset="0%" stopColor="#7c3aed" stopOpacity="0.22"/>

                  </linearGradient>

                {[2,4,6,8,10,11].map(g=>(

                    <text x={padX-5} y={yOf(g)+3} textAnchor="end" fontSize="7" fill="#c4bcae" fontWeight="700">{g}</text>
                  </g>
                ))}
                <path d={areaD} fill="url(#moodFill)"/>
                <path d={lineD} fill="none" stroke="#7c3aed" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" opacity="0.55"/>
                {pts.map(p=>(
                  <circle key={p.key} cx={p.x} cy={p.y} r="3.4" fill={moodBand(p.v)} stroke="#fff" strokeWidth="1.4"/>

function fmtMoney(n,dec){
  const v=parseFloat(n)||0;

// Timebox slots: 6:00 AM → 2:00 AM next day, 30-min steps
const TIMEBOX_SLOTS=(()=>{const a=[];for(let t=6*60;t<=26*60;t+=30){const hr=Math.floor(t/60);const mm=t%60;const h24=hr%24;const ap=h24<12?"AM":"PM";let h12=h24%12;if(h12===0)h12=12;a.push({key:String(hr).padStart(2,"0")+":"+String(mm).padStart(2,"0"),label:h12+":"+String(mm).padStart(2,"0")+" "+ap,hour:mm===0});}return a;})();

// Auto-growing textarea - expands to fit content, never scrolls internally
// ── WINS AS SEPARATE ENTRIES ────────────────────────────────────────────────
// The store does not change: a day's wins are still ONE string under the same key,
// and every export still reads that string. Rows are a VIEW of it. A blank line is
// the separator, chosen because a single win runs to several lines by his own rule
// (a two-star win is three to five lines), so splitting on every newline would tear
// one win into pieces.
//
// Nothing is trimmed away here on purpose. A trailing empty part is a real, empty
// row he just created and has not typed into yet, and trimming it would make the
// row vanish under his hands.
// An empty day yields ONE empty row rather than none. Without this, joinWins([""])
// is "" and splitWins("") was [], so the first "+ NEW WIN" of the day wrote nothing
// and the row he had just asked for vanished the instant it appeared.
function splitWins(text){
  const t=String(text==null?"":text);
  if(t==="") return [""];
  return t.split(/\n[ \t]*\n/);
}
function joinWins(parts){ return parts.join("\n\n"); }
// Inside a single win, consecutive blank lines are collapsed to one newline. Without
// this, pressing Enter twice while writing would silently split the win in half and
// move the cursor, mid-sentence.
function oneWinText(v){ return String(v==null?"":v).replace(/\n[ \t]*\n+/g,"\n"); }

function AutoTextarea({value,onChange,placeholder,style,onKeyDown,dataBid}){
  const ref=React.useRef(null);
  const resize=()=>{const el=ref.current;if(el){el.style.height="auto";el.style.height=(el.scrollHeight)+"px";}};
  React.useLayoutEffect(()=>{resize();},[value]);
  return <textarea ref={ref} data-bid={dataBid} value={value} onChange={onChange} onInput={resize} onKeyDown={onKeyDown} placeholder={placeholder} rows={1} style={{...style,overflow:"hidden",resize:"none"}}/>;
}

// Move a brainstorm idea to today: RELOCATES it, never duplicates it, so it only ever
// lives in one place, its origin day or today, never both. Used by PlanPanel's own
// per-day move arrow AND the cross-day Backlog list, so the relocation logic exists
// exactly once and the two can never disagree.
// keepPin controls whether a pinned idea stays pinned after the move (the per-day
// arrow's original behavior, unchanged). The Backlog list passes keepPin:false: a
// backlog idea should never surface with a TOP badge just because it happened to be
// pinned on the day it was written, and it always lands at the plain end of the list.
function moveIdeaToToday(planData, setPlanField, m, d, id, keepPin=true){
  if(m===TODAY_M&&d===TODAY_D) return;
  const getItems=(mm,dd)=>{
    const day=planData[mm+"-"+dd]||{};
    return day.brainstormItems||(day.brainstorm&&day.brainstorm.trim()?[{id:1,text:day.brainstorm,done:false}]:[]);
  };
  const items=getItems(m,d);
  const it=items.find(x=>x.id===id); if(!it) return;
  const tItems=getItems(TODAY_M,TODAY_D);
  setPlanField(TODAY_M,TODAY_D,"brainstormItems",[...tItems,{id:Date.now()+Math.random(),text:it.text,done:it.done||false,pin:keepPin?(it.pin||false):false}]);
  setPlanField(m,d,"brainstormItems",items.filter(x=>x.id!==id));
}

// BACKLOG. A computed VIEW, not a new store. It aggregates every past day's not-done
// brainstorm ideas into one list, so nothing needs to be migrated or flagged: an idea
// leaves this list the instant it's marked done or moved, because the filter (day is
// in the past AND done===false) simply stops matching it. Today's own ideas are never
// included here, they're already visible in the Brainstorm card just above.
// Label is a placeholder ("BACKLOG") pending Konstantin's own name for this, a single
// string, one line to change whenever he has it.
// Flat export of the backlog: date, then the idea text, oldest first. Same
// no-sections style as the day export, since this is meant to be pasted straight
// into a chat that already knows the app's shorthand.
function buildBacklogText(rows){
  const M={4:"APR",5:"MAY",6:"JUN",7:"JUL",8:"AUG",9:"SEP",10:"OCT"};
  let out=`LIFE OS · BRAINSTORM BACKLOG · ${rows.length} idea${rows.length===1?"":"s"} carried over\n`;
  out+="=".repeat(40)+"\n";
  rows.forEach(({m,d,it})=>{ out+=`${M[m]||m} ${d}: ${it.text.trim()}\n`; });
  out+=`\nend of backlog export`;
  return out;
}
// CARRIED OVER, the shared row builder. Every past day's not-done brainstorm idea,
// oldest first. A computed VIEW, not a store: an idea leaves the list the moment it
// is marked done or moved, because the filter stops matching it. Extracted so the
// Plan card and the week export read from ONE implementation.
function carriedOverRows(planData){
  const rows=[];
  Object.keys(planData||{}).forEach(dk=>{
    const parts=dk.split("-"); const m=+parts[0], d=+parts[1];
    if(!m||!d) return;
    if((m*100+d)>=(TODAY_M*100+TODAY_D)) return; // strictly past days only
    const day=planData[dk]||{};
    const items=day.brainstormItems||(day.brainstorm&&day.brainstorm.trim()?[{id:1,text:day.brainstorm,done:false}]:[]);
    items.forEach(it=>{
      if(it.done) return;
      if(!(it.text||"").trim()) return;
      rows.push({m,d,it});
    });
  });
  // Oldest first: the longest-sitting idea surfaces at the top, matching the same
  // "oldest avoided item first" logic the Top 3 T1 rule already uses.
  rows.sort((a,b)=>(a.m*100+a.d)-(b.m*100+b.d));
  return rows;
}
const BACKLOG_LABEL="CARRIED OVER";

          background:copied?"#16a34a":"rgba(232,201,143,0.14)",color:copied?"#fff":"#e8c98f",

// FUTURE PROJECTS: a standing, unranked pool, unlike Week Priorities (5 slots,
// re-decided every week). Add anytime, unlimited count. He ranks from this pool into
// Week Priorities himself; the app doesn't guess at ranking. Own localStorage key,
// independent of allData/planData, same pattern AtlasVision already uses. Appears in
// the WEEK export only (both week-export entry points already call the one shared
// buildWeekText, so this shows identically from either button with no extra work).
function FutureProjects(){
  const PK="lifeos_projects26";
  const [items,setItems]=useState(()=>{try{return JSON.parse(localStorage.getItem(PK)||"[]");}catch(e){return [];}});
  const [open,setOpen]=useState(false);
  // Rows are edited in place, exactly like a Top 3 row. The old pencil / SAVE /
  // CANCEL mode is gone, and so is the separate draft input: adding is a button
  // that creates an empty row, then you type into the row itself.
  const focusIdRef=useRef(null);
  // Same drag mechanics as the Top 3 board: refs drive the move, state drives the
  // repaint, and the handle carries touchAction:"none" because React binds touchmove
  // passively and preventDefault inside the handler does nothing.
  const [draggingIdx,setDraggingIdx]=useState(null);
  const [dragOverIdx,setDragOverIdx]=useState(null);
  const dragIdxRef=useRef(null), dragOverRef=useRef(null), rowRefs=useRef([]);
  const holdTimerRef=useRef(null), holdPendingRef=useRef(null);
  const holdClear=()=>{ if(holdTimerRef.current){clearTimeout(holdTimerRef.current);holdTimerRef.current=null;} holdPendingRef.current=null; };
  const save=(next)=>{setItems(next);lsWrite(PK,JSON.stringify(next));};
  const addRow=()=>{
    const nid=Date.now()+Math.random();
    focusIdRef.current=nid;
    save([...items,{id:nid,text:""}]);
  };
  const setText=(id,val)=>save(items.map(x=>x.id===id?{...x,text:val.replace(/\n/g,"")}:x));
  // Always asks, and the question names what is about to go. An empty row is a
  // different question from a row with your words in it.
  const del=(id)=>{
    const it=items.find(x=>x.id===id);
    const t=slotText((it&&it.text)||"");
    if(!confirm(t?("Remove this project?\n\n"+t):"Remove this empty project?")) return;
    save(items.filter(x=>x.id!==id));
  };
  // Reorder. The numbered badge already implied a ranking, but there was no way to
  // change it, so the number only ever showed the order things were typed in. Moving
  // an item is what makes that number mean something.
  // Lift out and reinsert, the same as Top 3's moveSlot. A straight swap would be
  // wrong for a drag across several rows: dragging item 5 to the top must push 1-4
  // down one place, not trade 5 with 1.
  const moveItem=(from,to)=>{
    if(from===to||from==null||to==null) return;
    if(from<0||to<0||from>=items.length||to>=items.length) return;
    const next=[...items];
    const [moved]=next.splice(from,1);
    next.splice(to,0,moved);
    save(next);
  };
  useEffect(()=>{
    if(focusIdRef.current===null) return;
    const el=document.querySelector('[data-fpid="'+focusIdRef.current+'"]');
    if(el) el.focus();
    focusIdRef.current=null;
  });
  // Same hold-to-drag gate as the Top 3 board: nothing is picked up until the finger
  // has stayed put for HOLD_MS, and any movement before that cancels the gesture.
  const onDragStart=(i)=>{
    holdClear();
    holdPendingRef.current=i;
    holdTimerRef.current=setTimeout(()=>{
      holdTimerRef.current=null;
      const idx=holdPendingRef.current;
      if(idx===null||idx===undefined) return;
      dragIdxRef.current=idx;dragOverRef.current=idx;setDraggingIdx(idx);setDragOverIdx(idx);
    },HOLD_MS);
  };
  const onDragMove=(e)=>{
    if(dragIdxRef.current===null){ holdClear(); return; }
    const y=e.touches[0].clientY;
    let closest=dragIdxRef.current,minDist=Infinity;
    rowRefs.current.forEach((ref,ri)=>{
      if(!ref||ri>=items.length) return;   // a ref left behind by a deleted row
      const r=ref.getBoundingClientRect();
      const dist=Math.abs(y-(r.top+r.height/2));
      if(dist<minDist){minDist=dist;closest=ri;}
    });
    if(closest!==dragOverRef.current){dragOverRef.current=closest;setDragOverIdx(closest);}
  };
  const onDragEnd=()=>{
    holdClear();
    if(dragIdxRef.current===null) return;
    moveItem(dragIdxRef.current,dragOverRef.current);
    dragIdxRef.current=null;dragOverRef.current=null;setDraggingIdx(null);setDragOverIdx(null);
  };
  return (
    <div style={{background:"#fff",borderRadius:16,border:"1px solid #ddd6fe",marginBottom:12,overflow:"hidden",boxShadow:"0 3px 16px rgba(79,70,229,0.07)"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",display:"flex",alignItems:"center",gap:7,padding:"9px 12px",background:"linear-gradient(135deg,#4338ca,#3730a3)",border:"none",cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>
        <span style={{fontSize:10,lineHeight:1}}>🗂️</span>
        <span style={{fontSize:8,fontWeight:800,color:"#fff",letterSpacing:1.8}}>FUTURE PROJECTS</span>
        <span style={{background:"rgba(255,255,255,0.9)",color:"#3730a3",borderRadius:10,fontSize:8,fontWeight:900,padding:"1px 7px",lineHeight:1.4}}>{items.filter(x=>slotFilled(x.text||"")).length}</span>
        <span style={{flex:1}}/>
        <span style={{fontSize:12,color:"#c7d2fe",transform:open?"rotate(90deg)":"none",transition:"transform .2s",display:"inline-block"}}>▸</span>
      </button>
      {open&&(
        <div style={{padding:"10px 12px",display:"flex",flexDirection:"column",gap:7}}>
          <div style={{fontSize:8,color:"#3730a3",lineHeight:1.5,marginBottom:2}}>Drag the handle to rank them. Goes into the week export.</div>
          {!items.length&&(
            <div style={{fontSize:11,color:"#6b6157",lineHeight:1.6,padding:"6px 2px"}}>Nothing here yet. Tap the button below and start typing.</div>
          )}
          {items.map((it,i)=>(
            <div key={it.id} ref={el=>rowRefs.current[i]=el} style={{display:"flex",alignItems:"flex-start",gap:8,background:"#f5f5ff",borderRadius:12,border:"1px solid #ddd6fe",borderLeft:"3px solid #6366f1",padding:"9px 10px",opacity:draggingIdx===i?0.4:1,boxShadow:draggingIdx!==null&&dragOverIdx===i&&dragOverIdx!==draggingIdx?"inset 0 3px 0 0 #4338ca":"none",transition:"box-shadow .12s"}}>
              {/* Same handle as the Top 3 board: 36 wide, 17px glyph, the rank centred
                  directly over the dots rather than sitting off to one side. */}
              <div onTouchStart={()=>onDragStart(i)} onTouchMove={onDragMove} onTouchEnd={onDragEnd}
                title="Hold and drag to reorder"
                style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",width:36,minHeight:46,alignSelf:"stretch",borderRadius:8,flexShrink:0,cursor:"grab",background:draggingIdx===i?"#e0e7ff":"transparent",touchAction:"none",userSelect:"none",WebkitUserSelect:"none",WebkitTapHighlightColor:"transparent"}}>
                <span style={{fontSize:8,fontWeight:900,color:"#3730a3",lineHeight:1,marginBottom:3}}>{i+1}</span>
                <span style={{fontSize:17,color:draggingIdx===i?"#4338ca":"#7a6f63",lineHeight:1}}>⠿</span>
              </div>
              <textarea value={it.text||""} rows={1} data-fpid={String(it.id)}
                ref={el=>{if(el){el.style.height="auto";el.style.height=Math.max(el.scrollHeight,22)+"px";}}}
                onChange={e=>{setText(it.id,e.target.value);e.target.style.height="auto";e.target.style.height=Math.max(e.target.scrollHeight,22)+"px";}}
                onKeyDown={e=>{if(e.key==="Enter")e.preventDefault();}}
                placeholder="What do you want to do one day..."
                style={{flex:1,minWidth:0,border:"none",outline:"none",background:"none",resize:"none",overflow:"hidden",fontSize:13,lineHeight:1.4,fontFamily:"inherit",color:"#241c12",padding:"5px 0"}}/>
              <button onClick={()=>del(it.id)} title="Remove" style={{flexShrink:0,width:28,height:28,borderRadius:"50%",background:"#e0e7ff",border:"none",fontSize:11,color:"#4338ca",cursor:"pointer",padding:0,fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",touchAction:"manipulation"}}>✕</button>
            </div>
          ))}
        </div>
      )}
      {open&&(
        <button onClick={addRow} style={{width:"100%",padding:"11px 0",background:"#f5f5ff",border:"none",borderTop:"1px solid #ece9fd",color:"#3730a3",fontSize:9,fontWeight:800,letterSpacing:1.5,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>+ ADD A PROJECT</button>
      )}
    </div>
  );
}

// WEEK PRIORITIES · ONE component, rendered in BOTH Today and Plan.
// He needs P1-P5 in the morning while aiming the day AND in the evening while
// closing it, so the card appears in both tabs. It is deliberately not duplicated
// markup: this is one function called twice, and priChecks is owned by App and
// passed in, because all four tabs render at once in the swipe carousel. Two local
// copies of that state would let a tick appear in one tab and not the other.
function WeekPriorities({w,weekAssess,setPriority,setAssess,priChecks,savePriChecks}){
  const toggleCheck=(wn,i)=>{const key="w"+wn;const cur=priChecks[key]||[];const next=cur.includes(i)?cur.filter(x=>x!==i):[...cur,i];savePriChecks({...priChecks,[key]:next});};
  const isChecked=(wn,i)=>(priChecks["w"+wn]||[]).includes(i);
  // Drag state is per-instance on purpose: a drag happening in one tab has no
  // business animating rows in the other.
  const prioDragIdxRef=useRef(null);
  const prioDragOverIdxRef=useRef(null);
  const [draggingPrio,setDraggingPrio]=useState(null);
  const prioRowRefsArr=useRef([]);
  return (
    <React.Fragment>
        <div style={{background:"#fff",borderRadius:16,border:"1px solid #99f6e4",marginBottom:12,overflow:"hidden",boxShadow:"0 3px 16px rgba(15,118,110,0.10)"}}>
          <div style={{padding:"9px 12px",background:"linear-gradient(135deg,#0f766e,#115e59)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:8,fontWeight:800,color:"#fff",letterSpacing:1.8}}>🎯 WEEK PRIORITIES</span>
            <span style={{fontSize:7,color:"#ccfbf1",fontWeight:700}}>{wkLabel(w)}</span>
          </div>
          <div style={{padding:"2px 0"}}>
            {(()=>{
              const priorities=weekAssess?.["w"+w.n]?.priorities||["","","","",""];
              const movePriority=(from,to)=>{
                if(from===to) return;
                const checkedSet=new Set(priChecks["w"+w.n]||[]);
                const snap=priorities.map((text,i)=>({text,chk:checkedSet.has(i)}));
                const arr=[...snap];
                const [moved]=arr.splice(from,1);
                arr.splice(to,0,moved);
                setAssess("w"+w.n,{...(weekAssess?.["w"+w.n]||{}),priorities:arr.map(x=>x.text)});
                const nextChecked=[];
                arr.forEach((x,i)=>{ if(x.chk) nextChecked.push(i); });
                savePriChecks({...priChecks,["w"+w.n]:nextChecked});
              };
              const onDragStart=(i)=>{prioDragIdxRef.current=i;setDraggingPrio(i);};
              const onDragEnter=(i)=>{prioDragOverIdxRef.current=i;};
              const onDragEnd=()=>{
                if(prioDragIdxRef.current!==null&&prioDragOverIdxRef.current!==null&&prioDragIdxRef.current!==prioDragOverIdxRef.current){
                  movePriority(prioDragIdxRef.current,prioDragOverIdxRef.current);
                }
                prioDragIdxRef.current=null;prioDragOverIdxRef.current=null;setDraggingPrio(null);
              };
              const onTouchStart=(i)=>{prioDragIdxRef.current=i;setDraggingPrio(i);};
              const onTouchMove=(e)=>{
                if(prioDragIdxRef.current===null) return;
                e.preventDefault();
                const y=e.touches[0].clientY;
                let closest=prioDragIdxRef.current,minDist=Infinity;
                prioRowRefsArr.current.forEach((ref,ri)=>{
                  if(!ref) return;
                  const rect=ref.getBoundingClientRect();
                  const dist=Math.abs(y-(rect.top+rect.height/2));
                  if(dist<minDist){minDist=dist;closest=ri;}
                });
                prioDragOverIdxRef.current=closest;
              };
              const onTouchEnd=()=>onDragEnd();
              return priorities.map((p,i)=>{
                const checked=isChecked(w.n,i);
                const isDraggingThis=draggingPrio===i;
                return (
                  <div key={i} ref={el=>prioRowRefsArr.current[i]=el}
                    draggable onDragStart={()=>onDragStart(i)} onDragEnter={()=>onDragEnter(i)}
                    onDragEnd={onDragEnd} onDragOver={ev=>ev.preventDefault()}
                    style={{display:"flex",alignItems:"center",gap:6,padding:"5px 10px",borderBottom:i<priorities.length-1?"1px solid #f3efe7":"none",background:isDraggingThis?"#f0f4ff":"transparent",opacity:isDraggingThis?0.5:1}}>
                    <div onTouchStart={()=>onTouchStart(i)} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
                      title="Hold and drag to reorder"
                      style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"grab",flexShrink:0,width:34,minHeight:38,alignSelf:"stretch",borderRadius:8,background:isDraggingThis?"#e0e7ff":"transparent",touchAction:"none",userSelect:"none",WebkitUserSelect:"none",WebkitTapHighlightColor:"transparent"}}>
                      <span style={{fontSize:8,fontWeight:900,color:"#7a5f33",lineHeight:1,marginBottom:2,letterSpacing:0.3}}>P{i+1}</span>
                      <span style={{fontSize:16,color:isDraggingThis?"#4338ca":"#7a6f63",lineHeight:1}}>⠿</span>
                    </div>
                    <button onClick={()=>toggleCheck(w.n,i)} style={{
                      width:26,height:26,borderRadius:6,border:"2px solid "+(checked?"#1b5e20":"#ddd"),
                      background:checked?"#1b5e20":"#fff",cursor:"pointer",flexShrink:0,
                      display:"flex",alignItems:"center",justifyContent:"center",padding:0,touchAction:"manipulation",
                    }}>
                      {checked&&<span style={{fontSize:12,color:"#fff",fontWeight:900,lineHeight:1}}>✓</span>}
                    </button>
                    <textarea
                      value={p||""} rows={1}
                      ref={el=>{if(el){el.style.height="auto";el.style.height=Math.max(el.scrollHeight,30)+"px";}}}
                      onChange={e=>{setPriority(w.n,i,e.target.value.replace(/\n/g,""));e.target.style.height="auto";e.target.style.height=Math.max(e.target.scrollHeight,30)+"px";}}
                      onKeyDown={e=>{if(e.key==="Enter")e.preventDefault();}}
                      placeholder={"Priority for week - P"+(i+1)+"..."}
                      style={{flex:1,border:"none",padding:"3px 2px",fontSize:11,fontFamily:"'SF Mono','Courier New',monospace",color:checked?"#aaa":"#241c12",outline:"none",background:"transparent",textDecoration:"none",minWidth:0,resize:"none",lineHeight:1.35,overflowY:"auto",display:"block"}}
                    />
                  </div>
                );
              });
            })()}
          </div>
        </div>
    </React.Fragment>
  );
}

function PlanPanel({viewM,viewDay,setViewDay,setViewM,planData,setPlanField,allData,getMI,setTask,appendTask,taskChecks,saveTaskChecks,taskSlotsMap,saveTaskSlotsMap,escalations,saveEscalations,weekAssess,setPriority,setAssess,priChecks,savePriChecks}){
  const dk=viewM+"-"+viewDay;
  const day=planData[dk]||{};
  const gotoDay=(delta)=>{
    const m=MONTHS_ARR.find(x=>x.m===viewM); if(!m) return;
    let nd=viewDay+delta, nm=viewM;
    if(nd<1){ const pm=MONTHS_ARR.find(x=>x.m===viewM-1); if(pm){nm=pm.m; nd=pm.days;} else nd=1; }
    else if(nd>m.days){ const nx=MONTHS_ARR.find(x=>x.m===viewM+1); if(nx){nm=nx.m; nd=1;} else nd=m.days; }
    setViewM(nm); setViewDay(nd);
  };
  const filled=TIMEBOX_SLOTS.filter(s=>(day[s.key]||"").trim()).length;
  const items=day.brainstormItems||(day.brainstorm&&day.brainstorm.trim()?[{id:1,text:day.brainstorm,done:false}]:[]);
  const setItems=(next)=>setPlanField(viewM,viewDay,"brainstormItems",next);
  const addItem=()=>setItems([...items,{id:Date.now()+Math.random(),text:"",done:false}]);
  const updItem=(id,patch)=>setItems(items.map(it=>it.id===id?{...it,...patch}:it));
  // Reminders-style keyboard: Enter makes a NEW idea below (not a newline inside one).
  // Enter on an empty idea exits the field. Backspace at the very start of an empty idea
  // deletes it and moves focus to the previous idea's end.
  const bFocusId=useRef(null);
  const bHandleKey=(e,it,idx)=>{
    if(e.key==="Enter"&&!e.shiftKey){
      e.preventDefault();
      if(!(it.text||"").trim()){ e.target.blur(); return; }
      const nid=Date.now()+Math.random();
      const arr=[...items];
      arr.splice(idx+1,0,{id:nid,text:"",done:false});
      bFocusId.current=nid;
      setItems(arr);
    } else if(e.key==="Backspace" && !(it.text||"").length){
      // Only ever removes a row that is ALREADY empty, so no text can be lost here.
      e.preventDefault();
      if(items.length<=1) return;
      const prev=items[idx-1];
      setItems(items.filter(x=>x.id!==it.id));
      if(prev) bFocusId.current="end:"+prev.id;
    }
  };
  useEffect(()=>{
    if(!bFocusId.current) return;
    const raw=String(bFocusId.current);
    const toEnd=raw.indexOf("end:")===0;
    const fid=toEnd?raw.slice(4):raw;
    const el=document.querySelector('[data-bid="'+fid+'"]');
    if(el){ el.focus(); if(toEnd){const L=el.value.length; try{el.setSelectionRange(L,L);}catch(_){}} }
    bFocusId.current=null;
  });
  const delItem=(id)=>setItems(items.filter(it=>it.id!==id));
  const pinItem=(id)=>{const it=items.find(x=>x.id===id);if(!it)return;if(it.pin){setItems(items.map(x=>x.id===id?{...x,pin:false}:x));}else{setItems([{...it,pin:true},...items.filter(x=>x.id!==id)]);}};
  const doneCount=items.filter(it=>it.done).length;
  const [copied,setCopied]=useState(false);
  const isTodayView=viewM===TODAY_M&&viewDay===TODAY_D;
  const moveToToday=(id)=>moveIdeaToToday(planData,setPlanField,viewM,viewDay,id);
  // Drag-to-reorder (same interaction as Top 3 tasks in Today)
  const bDragIdx=useRef(null), bOverIdx=useRef(null), bRowRefs=useRef([]);
  const [bDragging,setBDragging]=useState(null);
  const reorderItems=(from,to)=>{if(from===to||from==null||to==null)return;const a=items.slice();const[m]=a.splice(from,1);a.splice(to,0,m);setItems(a);};
  const bStart=(i)=>{bDragIdx.current=i;bOverIdx.current=i;setBDragging(i);};
  const bMove=(e)=>{if(bDragIdx.current===null)return;e.preventDefault();const y=e.touches[0].clientY;let closest=bDragIdx.current,md=Infinity;bRowRefs.current.forEach((ref,ri)=>{if(!ref||ri>=items.length)return;const r=ref.getBoundingClientRect();const d=Math.abs(y-(r.top+r.height/2));if(d<md){md=d;closest=ri;}});bOverIdx.current=closest;};
  const bEnd=()=>{if(bDragIdx.current!==null&&bOverIdx.current!==null)reorderItems(bDragIdx.current,bOverIdx.current);bDragIdx.current=null;bOverIdx.current=null;setBDragging(null);};
  return (
    <div>
      <div style={{position:"relative",overflow:"hidden",background:"linear-gradient(135deg,#334155,#0f172a)",borderRadius:18,padding:"14px 16px",marginBottom:14,boxShadow:"0 5px 18px rgba(15,23,42,0.26)"}}>
        <div style={{position:"absolute",top:-34,right:-34,width:110,height:110,borderRadius:"50%",background:"radial-gradient(circle,rgba(148,183,226,0.12),transparent 70%)",pointerEvents:"none"}}/>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6}}>
          <DayNavBtn dir="prev" onClick={()=>gotoDay(-1)}/>
          <div style={{textAlign:"center",flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              <div style={{fontSize:8,fontWeight:800,letterSpacing:3,color:"#94b7e2",textTransform:"uppercase"}}>Day Plan</div>
              {!(viewM===TODAY_M&&viewDay===TODAY_D)&&(
                <button onClick={()=>{setViewM(TODAY_M);setViewDay(TODAY_D);}}
                  title="Jump back to today's date"
                  style={{background:"none",border:"1px solid rgba(148,183,226,0.55)",color:"#cbd9ea",borderRadius:9,
                          padding:"2px 7px",fontSize:7,fontWeight:800,letterSpacing:0.6,cursor:"pointer",
                          fontFamily:"inherit",touchAction:"manipulation"}}>→ TODAY</button>
              )}
            </div>
            <div style={{fontSize:17,fontWeight:900,color:"#fff",lineHeight:1.2}}>{weekdayShort(viewM,viewDay)} {M_LABEL[viewM]} {viewDay}</div>
          </div>
          <DayNavBtn dir="next" onClick={()=>gotoDay(1)}/>
        </div>
        <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:8,alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={()=>{copyText(buildDayText(viewM,viewDay,allData,planData));setCopied(true);setTimeout(()=>setCopied(false),1800);}}
            title={"Copy everything for "+weekdayShort(viewM,viewDay)+" "+M_LABEL[viewM]+" "+viewDay+": Top 3, grid, notes, wins and brainstorm"}
            style={{width:30,height:26,flexShrink:0,borderRadius:9,background:copied?"#16a34a":"rgba(148,183,226,0.14)",
                    color:copied?"#fff":"#cbd9ea",border:"1px solid "+(copied?"#16a34a":"rgba(148,183,226,0.45)"),
                    cursor:"pointer",fontFamily:"inherit",fontSize:13,lineHeight:1,display:"flex",
                    alignItems:"center",justifyContent:"center",touchAction:"manipulation"}}>{copied?"✓":"⧉"}</button>
          <span style={{fontSize:8,color:"#aebdd0",fontWeight:700}}>{doneCount}/{items.length} Brainstorm done</span>
        </div>
      </div>

      {/* TOP 3 TASKS - the very same board as the Today tab, not a copy */}
      <Top3Tasks allData={allData} getMI={getMI} viewM={viewM} viewDay={viewDay}
        setTask={setTask} appendTask={appendTask}
        taskChecks={taskChecks} saveTaskChecks={saveTaskChecks}
        taskSlotsMap={taskSlotsMap} saveTaskSlotsMap={saveTaskSlotsMap}
        escalations={escalations} saveEscalations={saveEscalations}/>

      <WeekPriorities w={getWeekForDay(viewM,viewDay)||Q2_WEEKS[0]} weekAssess={weekAssess}
        setPriority={setPriority} setAssess={setAssess}
        priChecks={priChecks} savePriChecks={savePriChecks}/>

      <FutureProjects/>

      <div style={{background:"#fff",borderRadius:16,border:"1px solid #e8dcc0",marginBottom:12,overflow:"hidden",boxShadow:"0 4px 18px rgba(168,135,74,0.14)"}}>
        <div style={{padding:"9px 14px",background:"linear-gradient(135deg,#c9a96e,#a8874a)",display:"flex",alignItems:"center",gap:8}}>
          <span style={{width:6,height:6,borderRadius:"50%",background:"#241c12",flexShrink:0}}/>
          <span style={{fontSize:8,fontWeight:800,letterSpacing:1.8,color:"#241c12"}}>BRAINSTORM · ONE IDEA PER LINE</span>
          <span style={{flex:1}}/>
          <button onClick={()=>setPlanField(viewM,viewDay,"bsChecked",!day.bsChecked)} title="Mark this day's brainstorm as reviewed" style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",cursor:"pointer",padding:"2px 4px",borderRadius:4,touchAction:"manipulation"}}>
            <div style={{width:14,height:14,borderRadius:3,border:`2px solid ${day.bsChecked?"#d97706":"#e3d0a8"}`,background:day.bsChecked?"#d97706":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {day.bsChecked&&<span style={{fontSize:9,color:"#fff",fontWeight:900,lineHeight:1}}>✓</span>}
            </div>
            <span style={{fontSize:7,color:day.bsChecked?"#d97706":"#c9b48a",fontWeight:700,letterSpacing:1}}>CHECKED</span>
          </button>
        </div>
        {items.length===0&&(
          <div style={{padding:"16px 14px",fontSize:11,color:"#7a6f63",lineHeight:1.5}}>Dump everything on your mind, one idea per line. Check them off, then pull the timebox + Top 3 out of them.</div>
        )}
        {items.map((it,idx)=>{
          const dragging=bDragging===idx;
          return (
          <div key={it.id} ref={el=>bRowRefs.current[idx]=el}
            draggable onDragStart={()=>bStart(idx)} onDragEnter={()=>{bOverIdx.current=idx;}} onDragOver={e=>e.preventDefault()} onDragEnd={bEnd}
            style={{display:"flex",alignItems:"flex-start",gap:7,padding:"9px 12px 9px 8px",borderTop:"1px solid #f3efe7",borderLeft:it.pin?"3px solid #a8874a":"3px solid #c4b8a4",background:dragging?"#f0f4ff":it.pin?"#fffdf6":"transparent",opacity:dragging?0.6:1}}>

      </div>

  );
}

// BUDGET, shared layer. Pulled out of AtlasBudget so the week export can carry the
// same numbers the Budget panel shows. One quarter table, one earned-category rule,
// one store read, one export text. If these lived in two places they would drift.
const BUDGET_KEY="lifeos_budget26";
const BUDGET_QUARTERS=[
  {q:2,label:"26Q2",sub:"TO JUL 5, 2026",months:[4,5,6],goal:3000},
  {q:3,label:"26Q3",sub:"JUL 6 TO OCT 4, 2026",months:[7,8,9,10],goal:4000},
];
const BUDGET_EARNED_CATS=["Rover","Photography","Gig","Business","Sales"];
const BUDGET_OTHER_CATS=["Rent","OW/Gov"];
function budgetIsEarned(cat){ return BUDGET_EARNED_CATS.includes(cat)||cat==="Gig work"; }
function budgetQuarter(q){ return BUDGET_QUARTERS.find(x=>x.q===q)||BUDGET_QUARTERS[0]; }
// persist=true keeps the panel's original behaviour of writing the migrated shape back.
// The export path passes false: reading a budget must never write to storage.
function readBudgetData(persist){
  try{
    const raw=localStorage.getItem(BUDGET_KEY);
    if(!raw) return {entries:[]};
    const parsed=JSON.parse(raw);
    if(Array.isArray(parsed.entries)) return parsed;
    const entries=[];
    Object.entries(parsed).forEach(([m,cats])=>{
      if(typeof cats==="object"&&!Array.isArray(cats)){
        Object.entries(cats).forEach(([cat,val])=>{
          const num=parseFloat(val)||0;
          if(num>0) entries.push({id:Date.now()+Math.random(),month:parseInt(m),amount:num,cat,note:"(migrated)",date:""});
        });
      }
    });
    const migrated={entries};
    if(persist){ lsWrite(BUDGET_KEY,JSON.stringify(migrated)); }
    return migrated;
  }catch(e){return {entries:[]};}
}
// Recurring items are quarter-scoped. Legacy items with no .q get one inferred
// from their months, exactly as the panel has always done.
function budgetRecurring(data){
  const raw=(data&&data.recurring)||[];
  return raw.map(r=>{
    if(r.q) return r;
    const ms=(r.months&&r.months.length)?r.months:[];
    return {...r,q:ms.some(m=>m>=7)?3:2};
  });
}
// THE budget export. Both the Budget panel button and the week export call this.
function buildBudgetText(q){
  const QC=budgetQuarter(q);
  const GOAL=QC.goal;
  const inQuarter=(m)=>QC.months.includes(m);
  const data=readBudgetData(false);
  const entries=data.entries||[];
  const qEntries=entries.filter(e=>inQuarter(e.month));
  const totalAll=qEntries.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const totalEarned=qEntries.filter(e=>budgetIsEarned(e.cat)).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const totalMonth=(m)=>entries.filter(e=>e.month===m).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const earnedMonth=(m)=>entries.filter(e=>e.month===m&&budgetIsEarned(e.cat)).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const qRecurring=budgetRecurring(data).filter(r=>r.q===QC.q);
  const recMonths=(r)=>(r.months&&r.months.length)?r.months:QC.months;
  let out="BUDGET "+QC.label+" ("+QC.sub+")\n"+"=".repeat(36)+"\n\n";
  MONTHS_ARR.filter(mo=>inQuarter(mo.m)).forEach(mo=>{
    const mes=entries.filter(e=>e.month===mo.m);
    if(!mes.length) return;
    out+=mo.name.toUpperCase()+" -- $"+totalMonth(mo.m).toFixed(2)+" (earned $"+earnedMonth(mo.m).toFixed(2)+")\n";
    mes.forEach(e=>{out+="  "+(e.date?e.date+" ":"")+e.cat+(e.client?" ("+e.client+")":"")+": $"+parseFloat(e.amount).toFixed(2)+(e.pending?" [PENDING]":"")+(e.note?" - "+e.note:"")+"\n";});
    out+="\n";
  });
  out+=QC.label+" EARNED: $"+totalEarned.toFixed(2)+" / $"+GOAL+" goal\n";
  out+=QC.label+" TOTAL CASH IN: $"+totalAll.toFixed(2);
  if(qRecurring.length){
    out+="\n\nRECURRING FIXED COSTS:\n";
    qRecurring.forEach(r=>{const ms=recMonths(r).filter(m=>inQuarter(m)).map(m=>(M_LABEL[m]||m)).join(",");if(!ms)return;out+="  "+(r.emoji?r.emoji+" ":"")+r.name+": $"+parseFloat(r.amount).toFixed(2)+(ms?" ["+ms+"]":"")+"\n";});
  }
  return out;
}

  const recMonthTotal=(m)=>qRecurring.filter(r=>recMonths(r).includes(m)).reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const prevQ=qView-1;

  const resetRecForm=()=>{setRecForm({name:"",amount:"",emoji:"",months:[]});setRecEditId(null);setShowRec(false);};
  const saveRecurring=()=>{
    const num=parseFloat(String(recForm.amount).replace(",",".").trim());
    if(!num||num<=0)return;
    // Default to all months of the viewed quarter if none picked.
    const picked=(recForm.months&&recForm.months.length)?recForm.months.slice().sort((a,b)=>a-b):qMonths.slice();

              style={{width:"100%",boxSizing:"border-box",border:"1px solid #e0e0e0",borderRadius:8,padding:"8px 10px",fontSize:13,fontFamily:"inherit",outline:"none",background:"#fafafa",minHeight:48,lineHeight:1.5}}/>

        :[...MONTHS_ARR].filter(mo=>inQuarter(mo.m)).reverse().map(mo=>{

            <div key={mo.m} style={{marginBottom:16}}>

                  <span style={{fontSize:12,fontWeight:900,color:"#4a9d6f"}}>{fmtMoney(totalMonth(mo.m))}</span>
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:5}}>
                {mes.map((e,mi2)=>(
                  <div key={e.id} style={{background:e.pending?"#fffdf7":"#fff",borderRadius:10,padding:"10px 10px",boxShadow:"0 1px 6px rgba(0,0,0,0.06)",display:"flex",alignItems:"stretch",gap:8,border:e.pending?"1.5px dashed #d4a574":"1.5px solid transparent"}}>
                    <div style={{display:"flex",flexDirection:"column",justifyContent:"center",gap:2,flexShrink:0}}>
                      <button onClick={()=>{if(mi2>0)swapById(e.id,mes[mi2-1].id);}} disabled={mi2===0} title="move up" style={{width:26,height:24,borderRadius:5,border:"1px solid #ece6dc",background:mi2===0?"#f6f4f0":"#fff",color:mi2===0?"#d8d2c8":"#8a7f6d",cursor:mi2===0?"default":"pointer",fontSize:10,fontWeight:900,padding:0,lineHeight:1,touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>▲</button>
                      <button onClick={()=>{if(mi2<mes.length-1)swapById(e.id,mes[mi2+1].id);}} disabled={mi2===mes.length-1} title="move down" style={{width:26,height:24,borderRadius:5,border:"1px solid #ece6dc",background:mi2===mes.length-1?"#f6f4f0":"#fff",color:mi2===mes.length-1?"#d8d2c8":"#8a7f6d",cursor:mi2===mes.length-1?"default":"pointer",fontSize:10,fontWeight:900,padding:0,lineHeight:1,touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>▼</button>
                    </div>
                    <div style={{width:4,borderRadius:2,background:CAT_COLOR[e.cat]||"#ccc",flexShrink:0,minHeight:36,opacity:e.pending?0.5:1}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:1,flexWrap:"wrap"}}>
                        <span style={{fontSize:8,fontWeight:800,color:CAT_COLOR[e.cat]||"#555"}}>{catLabel(e.cat)}</span>

                        {e.date&&<span style={{fontSize:7,color:"#7a6f63"}}>{e.date}</span>}
                        {e.pending&&<span style={{fontSize:7,fontWeight:900,color:"#b8860b",background:"#fdf3dc",borderRadius:8,padding:"1px 6px",letterSpacing:0.5}}>⏳ PENDING</span>}
                      </div>
                      {e.note&&<div style={{fontSize:11,color:"#241c12",lineHeight:1.45,marginTop:2,wordBreak:"break-word"}}>{e.note}</div>}
                    </div>
                    <div style={{fontSize:14,fontWeight:900,color:e.pending?"#b8860b":"#1a1a1a",flexShrink:0}}>{fmtMoney(e.amount)}</div>
                    <div style={{display:"flex",flexDirection:"column",gap:3,flexShrink:0}}>
                      <button onClick={()=>togglePending(e.id)} title={e.pending?"Mark as paid":"Mark as pending"} style={{background:e.pending?"#fdf3dc":"#f0f9f0",border:"none",borderRadius:6,padding:"3px 6px",fontSize:8,cursor:"pointer",fontWeight:800,color:e.pending?"#b8860b":"#16a34a",letterSpacing:0.3}}>{e.pending?"mark paid":"pending"}</button>
                      <button onClick={()=>startEdit(e)} style={{background:"#f5f5f5",border:"none",borderRadius:6,padding:"3px 6px",fontSize:9,cursor:"pointer"}}>edit</button>
                    </div>

              </div>
            </div>
          );
        })
      }
    </div>
  );
}

// ── ATLAS JOBS ────────────────────────────────────────────────────────────────
function AtlasJobs({onBack}) {
  const blankForm=()=>({date:"",company:"",status:"Resume dropped",contact:"",note:""});
  const JOBS_KEY="lifeos_jobs26";
  const JOB_STATUSES=["Resume dropped","Applied online","Interview","Trial shift","Offer","Closed"];
  const STATUS_COLOR={"Resume dropped":"#6b7280","Applied online":"#3b82f6","Interview":"#f59e0b","Trial shift":"#8b5cf6","Offer":"#16a34a","Closed":"#9ca3af"};
  const load=()=>{try{const v=localStorage.getItem(JOBS_KEY);return v?JSON.parse(v):[];}catch(e){return [];}};
  const [jobs,setJobsRaw]=useState(load);
  const [showAdd,setShowAdd]=useState(false);
  const [showExp,setShowExp]=useState(false);
  const [form,setForm]=useState({date:"",company:"",status:"Resume dropped",contact:"",note:""});
  const [editId,setEditId]=useState(null);
  const [origForm,setOrigForm]=useState(null);
  const save=(arr)=>{setJobsRaw(arr);lsWrite(JOBS_KEY,JSON.stringify(arr));};
  const addJob=()=>{
    if(!form.company.trim()) return;
    const entry={id:Date.now(),...form,date:form.date||(TODAY_M+"/"+TODAY_D)};
    const updated=editId?jobs.map(j=>j.id===editId?entry:j):[entry,...jobs];
    save(updated);setShowAdd(false);setForm(blankForm());setEditId(null);setOrigForm(null);
  };
  const deleteJob=(id)=>save(jobs.filter(j=>j.id!==id));
  const startEdit=(j)=>{
    const f={date:j.date,company:j.company,status:j.status,contact:j.contact||"",note:j.note||""};
    setForm(f);setOrigForm(f);setEditId(j.id);setShowAdd(true);
  };
  const isDirty=()=>{const base=editId?origForm:blankForm();return base&&JSON.stringify(form)!==JSON.stringify(base);};
  const requestClose=()=>{
    if(isDirty()&&!confirm("Discard the changes to this application? Nothing typed here will be saved."))return;
    setShowAdd(false);setEditId(null);setForm(blankForm());setOrigForm(null);
  };
  const buildExp=()=>{
    let out="JOB APPLICATIONS - Q2 2026\n"+"=".repeat(36)+"\n\n";
    jobs.forEach(j=>{
      out+=`${j.date}  ${j.company}\n`;
      out+=`  Status: ${j.status}\n`;
      if(j.contact) out+=`  Contact: ${j.contact}\n`;
      if(j.note) out+=`  Note: ${j.note}\n`;
      out+="\n";
    });
    return out.trim()||"No applications yet.";
  };
  const fld=(label,key,type="text",placeholder="")=>(
    <div style={{marginBottom:8}}>
      <div style={{fontSize:7,fontWeight:700,color:"#888",letterSpacing:1.5,marginBottom:3}}>{label}</div>
      <input type={type} value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))} placeholder={placeholder}
        style={{width:"100%",boxSizing:"border-box",border:"1px solid #e0e0e0",borderRadius:8,padding:"7px 10px",fontSize:12,fontFamily:"inherit",outline:"none",background:"#fafafa"}}/>
    </div>
  );
  return (
    <div>
      <button onClick={()=>{if(showAdd&&isDirty()&&!confirm("Discard the changes to this application? Nothing typed here will be saved."))return;onBack();}} style={{display:"flex",alignItems:"center",gap:8,background:"#f2ede6",border:"none",borderRadius:20,padding:"8px 16px 8px 12px",cursor:"pointer",fontFamily:"inherit",marginBottom:16,boxShadow:"0 2px 8px rgba(0,0,0,0.08)"}}>
        <span style={{fontSize:18,color:"#c9a96e",fontWeight:900,lineHeight:1}}>‹</span>
        <span style={{fontSize:10,fontWeight:800,color:"#2a2118",letterSpacing:2}}>ATLAS</span>
      </button>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:16}}>

// ── ATLAS EXPORTS (week · month · all) ───────────────────────────────────────
function _exGMI(m){return MONTHS_ARR.findIndex(x=>x.m===m);}
function _exReadLS(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}}
function _exWeekDays(wk){
  const days=[];let m=wk.start[0],d=wk.start[1];
  for(let i=0;i<14;i++){
    days.push({m,d});
    if(m===wk.end[0]&&d===wk.end[1]) break;
    d++;const mi=_exGMI(m);
    if(mi>=0&&d>MONTHS_ARR[mi].days){const ni=mi+1;if(ni>=MONTHS_ARR.length)break;m=MONTHS_ARR[ni].m;d=1;}
  }
  return days;
}
function buildWeekText(wk, allData){
  const M_NAME={4:"APR",5:"MAY",6:"JUN",7:"JUL",8:"AUG",9:"SEP",10:"OCT"};
  const wdays=_exWeekDays(wk);
  const tc=_exReadLS(K_TASK_CHECKS)||{};
  const pc=_exReadLS(K_PRI_CHECKS)||{};
  // Real key is prefixed (lsGet adds LS_VERSION), so reading bare "weekAssess" always
  // returned null and Week Priorities silently never appeared in the Atlas export.
  const wa=_exReadLS("lifeos_v8_weekAssess")||{};
  let out=`LIFE OS · 26Q${wk.q||2} WEEK ${wk.wn||wk.n} EXPORT (${wk.sm} ${wk.start[1]} to ${wk.em} ${wk.end[1]})\n`;
  out+=`Generated: ${M_NAME[TODAY_M]||TODAY_M} ${TODAY_D}\n`;
  // Headline weekly number, the SAME one the Today runner bar shows, so the week export
  // and the app can never disagree. Was missing: the week export reported "fully done
  // X/7 days" but never the weighted 0-700 total the whole system is scored on.
  {
    const _rd=weekRunner(allData,wdays);
    const _last=wdays[wdays.length-1];
    const _st=streakAsOf(allData,_last.m,_last.d);
    out+=`Week total: ${_rd.total}/${_rd.max} (${_rd.max?Math.round(_rd.total/_rd.max*100):0}%)   Streak at week end: ${_st} day${_st===1?"":"s"}\n\n`;
  }
  const finalWins=readWeeklyWins()["w"+wk.n];
  if(finalWins&&finalWins.trim()){
    out+=`⭐ Q${wk.q||2} WEEK ${wk.wn||wk.n} WINS (FINAL, after review):\n`;
    finalWins.trim().split("\n").forEach(l=>{if(l.trim())out+=`  ${l.trim()}\n`;});
    out+=`\n`;
  }
  out+=`TOP 3 + PILLARS DAILY:\n`;
  let t3FullDays=0;
  wdays.forEach(({m,d})=>{
    const mi=_exGMI(m); const data=allData[mi]; if(!data) return;
    const pct=top3pct(data,d,m);
    const en=data.energy?.[d]||"·";
    const mood=data.mood?.[d]||"·";
    const _pil=isQ3Day(m,d)?Q3_PILLARS:TOP3;
    const marks=_pil.map(h=>(h.disp||h.code)+(cellCounts(data.grid?.[h.code]?.[d])?"✓":(data.grid?.[h.code]?.[d]==="skip"?"–":"✗"))).join(" ");
    const allChecked=["t1","t2","t3"].every(slot=>!!tc[m+"-"+d+"-"+slot+"-c"]);
    if(allChecked) t3FullDays++;
    out+=`  ${M_NAME[m]||m} ${d}: ${marks} [${pct}%] energy:${en} mood:${mood}${allChecked?" ✓✓✓":""}\n`;
    const note=data?.notes?.[d];
    if(note?.trim()) out+=`    NOTE: ${note.trim()}\n`;
    const hl=data?.highlights?.[d];
    if(hl?.trim()){
      const _hc=(_exReadLS(K_HL_CHECKED)||{})[m+"-"+d];
      const _hs=(_exReadLS(K_HL_STARS)||{})[m+"-"+d]||0;
      out+=`    ✨ HIGHLIGHT${_hc?" ✓":""}${_hs?" [stood out: "+"⭐".repeat(_hs)+"]":""}: ${hl.trim()}\n`;
    }
    const wns=data?.wins?.[d];
    if(wns?.trim()){
      out+=`    WINS (raw):\n`;
      wns.trim().split("\n").forEach(line=>{if(line.trim()) out+=`      ${line.trim()}\n`;});
    }
    const t=data.tasks?.[d]||{};
    for(let s=1;s<=10;s++){
      const slot="t"+s;
      if(!(t[slot]||"").replace(/\u200b/g,"").trim()) break;
      const chk=!!tc[m+"-"+d+"-"+slot+"-c"];
      out+=`    T${s} [${chk?"✓":"·"}]: ${t[slot].replace(/\u200b/g,"").trim()}\n`;
    }
    // All brainstorm ideas for this same day: done (✓) and not-done (·), so each
    // day of the week carries its full brainstorm, matching the Copy Today export.
    const _pl=_exReadLS(K_PLAN)||{};
    const _pday=_pl[m+"-"+d]||{};
    const _bd=(_pday.brainstormItems||[]).filter(it=>(it.text||"").trim());
    if(_bd.length){
      out+=`    BRAINSTORM${_pday.bsChecked?" ✓":""}:\n`;
      _bd.forEach(it=>{ out+=`      ${it.done?"✓":"·"} ${it.text.trim()}\n`; });
    }
  });
  out+=`  TOP 3 TASKS FULLY DONE: ${t3FullDays}/${wdays.length} days\n`;
  // ESCALATED: the full standing list from its own card, same as the day export shows.
  {
    const _escList=Object.values(_exReadLS(K_ESCALATIONS)||{});
    if(_escList.length){
      out+=`\nESCALATED:\n`;
      _escList.forEach(e=>{ out+=`  ⚡ ${(e.text||"").trim()}\n`; });
    }
  }
  out+=`\nHAT WEEK SUMMARY:\n`;
  ALL_HATS.forEach(h=>{
    const filled=wdays.filter(({m,d})=>{
      const mi=_exGMI(m); return cellCounts(allData[mi]?.grid?.[h.code]?.[d]);
    }).length;
    if(filled>0) out+=`  ${hatLabel(h.code,wdays[0]&&wdays[0].m,wdays[0]&&wdays[0].d)}: ${filled}/${wdays.length} days\n`;
  });
  const wkPriChecks=pc["w"+wk.n]||[];
  const pris=(wa?.["w"+wk.n]?.priorities||[]);
  if(pris.some(p=>(p||"").trim())){
    out+=`\nWEEK PRIORITIES (Q${wk.q||2} W${wk.wn||wk.n}):\n`;
    pris.forEach((p,i)=>{
      if((p||"").trim()) out+=`  ${i+1}. [${wkPriChecks.includes(i)?"✓":"·"}] ${p}\n`;
    });
  }
  // FUTURE PROJECTS: the standing, unranked pool from Plan. He ranks these into
  // Week Priorities himself, the export just carries the full pool as-is.
  {
    const _proj=(_exReadLS("lifeos_projects26")||[]).filter(p=>(p.text||"").replace(/\u200b/g,"").trim());
    if(_proj.length){
      out+=`\nFUTURE PROJECTS:\n`;
      _proj.forEach((p,i)=>{ out+=`  ${i+1}. ${(p.text||"").trim()}\n`; });
    }
  }
  // CARRIED OVER: every past day's still-open brainstorm idea, the same list the Plan
  // card shows, from the same carriedOverRows function. Standing list, not week-scoped,
  // exactly like ESCALATED and FUTURE PROJECTS above it.
  {
    const _co=carriedOverRows(_exReadLS(K_PLAN)||{});
    if(_co.length){
      out+=`\nCARRIED OVER (${_co.length} open idea${_co.length===1?"":"s"}, all past days, oldest first):\n`;
      _co.forEach(({m,d,it})=>{ out+=`  ${M_NAME[m]||m} ${d}: ${it.text.trim()}\n`; });
    }
  }
  // BUDGET: the whole quarter this week belongs to, every entry and every total, from
  // the same buildBudgetText the Budget panel's own export button uses.
  {
    const _bud=buildBudgetText(wk.q||2);
    if(_bud&&_bud.trim()) out+=`\n${_bud.trim()}\n`;
  }
  // Extra + Library HATs for the week. NOTE: the old WeekView copy tried to inject these
  // via out.replace(' -  end of Week', ...) but that literal never appears in the text, so
  // they were silently dropped from every export. Appended directly now.
  const _exLines=[], _lbLines=[];
  wdays.forEach(({m,d})=>{
    const mi=_exGMI(m); const dd=allData[mi]; if(!dd) return;
    const ex=(dd.extraHats||{})[d]||[];
    const lb=(dd.libHats||{})[d]||[];
    if(ex.length) _exLines.push(`  ${M_NAME[m]||m} ${d}: ${ex.join(", ")}`);
    if(lb.length) _lbLines.push(`  ${M_NAME[m]||m} ${d}: ${lb.join(", ")}`);
  });
  if(_exLines.length) out+=`\nEXTRA ACTIVE HATS:\n${_exLines.join("\n")}\n`;
  if(_lbLines.length) out+=`\nLIBRARY TAGS:\n${_lbLines.join("\n")}\n`;

  out+=`\nend of Q${wk.q||2} Week ${wk.wn||wk.n} export`;
  // Photo Challenge marks for this week (May / Q2 only; empty for Q3 weeks).
  try {
    const challRaw=localStorage.getItem(K_CHALLENGE);
    if(challRaw){
      const challData=JSON.parse(challRaw);
      const challLines=[];
      wdays.forEach(({m,d})=>{
        if(m!==5) return;
        const entries=challData[`d${d}`]||[];
        if(entries.length){
          const labels=entries.map(e=>{
            const id=e.includes(":")?e.split(":")[0]:e;
            const st=e.includes(":")?e.split(":")[1]:"x";
            const item=CHALLENGE_ITEMS.find(i=>i.id===id);
            if(!item) return null;
            return (st==="back"?"◀ ":"× ")+item.text;
          }).filter(Boolean);
          if(labels.length) challLines.push(`  MAY ${d}: ${labels.join(" | ")}`);
        }
      });
      if(challLines.length){
        out+=`\n\n📸 PHOTO CHALLENGE · W${wk.n}:\n${challLines.join("\n")}`;
      }
    }
  } catch(e){}
  return out;
}
function buildMonthStats(mo, allData){
  const mi=_exGMI(mo.m);
  const data=allData[mi];
  const elapsed=(mo.m<TODAY_M)?mo.days:(mo.m===TODAY_M?TODAY_D:0);
  if(!data||elapsed===0) return `${mo.name.toUpperCase()} - no data yet.`;
  const tc=_exReadLS(K_TASK_CHECKS)||{};
  let out=`LIFE OS - ${mo.name.toUpperCase()} 2026 STATS\n`;
  out+=`Days elapsed: ${elapsed}/${mo.days}\n\n`;
  out+=`HAT COMPLETION (days marked / days elapsed):\n`;
  ALL_HATS.forEach(h=>{
    let n=0;for(let d=1;d<=elapsed;d++){if(cellCounts(data.grid?.[h.code]?.[d]))n++;}
    if(n>0) out+=`  ${hatLabel(h.code,mo.m,elapsed)}: ${n}/${elapsed} (${Math.round(n/elapsed*100)}%)\n`;
  });
  const moods=[];for(let d=1;d<=elapsed;d++){const v=data.mood?.[d];if(v)moods.push(v);}
  if(moods.length){
    const avg=(moods.reduce((a,b)=>a+b,0)/moods.length).toFixed(1);
    out+=`\nMOOD: avg ${avg} · min ${Math.min(...moods)} · max ${Math.max(...moods)} · logged ${moods.length}/${elapsed} days\n`;
  }
  const eCounts={};for(let d=1;d<=elapsed;d++){const e=data.energy?.[d];if(e)eCounts[e]=(eCounts[e]||0)+1;}
  const eKeys=Object.keys(eCounts);
  if(eKeys.length){
    out+=`ENERGY: `+eKeys.map(k=>`${k}×${eCounts[k]}`).join("  ")+`\n`;
  }
  let t3Full=0;for(let d=1;d<=elapsed;d++){if(["t1","t2","t3"].every(s=>!!tc[mo.m+"-"+d+"-"+s+"-c"]))t3Full++;}
  out+=`TOP 3 TASKS FULLY DONE: ${t3Full}/${elapsed} days\n`;
  let hlN=0,winN=0;for(let d=1;d<=elapsed;d++){if(data.highlights?.[d]?.trim())hlN++;if(data.wins?.[d]?.trim())winN++;}
  out+=`HIGHLIGHTS LOGGED: ${hlN} days · WINS LOGGED: ${winN} days\n`;
  out+=`\n(Full notes + highlights + wins text lives in the Month tab export)\nend of ${mo.name} stats`;
  return out;
}
// One export for the whole day: everything from the Today tab AND the Plan tab.
// Both COPY buttons (Today + Plan) call this, so they always produce the same text.
function buildDayText(m,d,allData,planData){
  const mi=_exGMI(m);
  const data=allData[mi];
  const M={4:"APR",5:"MAY",6:"JUN",7:"JUL",8:"AUG",9:"SEP",10:"OCT"};
  let out=`LIFE OS · DAY EXPORT · ${weekdayShort(m,d)} ${M[m]||m} ${d}, 2026\n`;
  out+="=".repeat(40)+"\n";
  if(!data){ out+="\nNo data for this day.\n"; return out; }
  const tc=_exReadLS(K_TASK_CHECKS)||{};
  // The numbers that matter: today's own Top 3 score and the streak ending here.
  // Streak deliberately does not break on an in-progress day (see streakAsOf) so
  // copying mid-day, before RJ2 closes it out, never shows a false break. Nothing
  // else gets summarized into a percentage - Konstantin wants this focused on Top 3,
  // not a second scoring system for every HAT group. The flat HATS MARKED list
  // further down already shows the day's grid as-is, with no extra math on top.
  const {pct:dayPctVal}=dayScorePct(allData,tc,m,d);
  const streak=streakAsOf(allData,m,d);
  out+=`Day score: ${dayPctVal}%   Streak: ${streak} day${streak===1?"":"s"}\n`;
  // Where the WEEK stands as of this day. Uses the same weekRunner the Today bar uses,
  // so the brief and the bar can never disagree. "possible so far" matters: 240/700 in
  // mid-week reads as failure without it, but 240 of 300 possible is a strong week.
  const _wi=weekIdxForDay(m,d);
  if(_wi>=0){
    const _wk=Q2_WEEKS[_wi];
    const _wdays=_exWeekDays(_wk);
    const _rd=weekRunner(allData,_wdays);
    let _elapsed=0;
    _wdays.forEach(({m:wm,d:wd})=>{ if((wm*100+wd)<=(m*100+d)) _elapsed++; });
    const _possible=_elapsed*100;
    const _pace=_possible?Math.round(_rd.total/_possible*100):0;
    out+=`Week ${wkLabel(_wk)}: ${_rd.total}/${_rd.max} · day ${_elapsed} of ${_wdays.length} (${_rd.total} of ${_possible} possible so far = ${_pace}%)\n`;
  }
  const en=data.energy?.[d], mv=data.mood?.[d];
  out+=`Energy: ${en||"-"}   Mood: ${mv?mv+"/11":"-"}\n\n`;
  const t=data.tasks?.[d]||{};
  out+="TOP 3 TASKS:\n";
  let any=false;
  for(let s=1;s<=10;s++){
    const slot="t"+s; const val=(t[slot]||"").replace(/\u200b/g,"").trim();
    if(!val){ if(s<=3) continue; else break; }
    const chk=!!tc[m+"-"+d+"-"+slot+"-c"];
    out+=`  ${s<=3?"T"+s:"  "} [${chk?"✓":"·"}] ${val}\n`; any=true;
  }
  if(!any) out+="  (none set)\n";
  // ESCALATED: the full accumulated list from the dedicated Escalated card, not
  // filtered to this day's own Top 3 tasks. It's a standing list across many days,
  // so it shows the same every day until an item is un-escalated or done.
  const _escAll=_exReadLS(K_ESCALATIONS)||{};
  const _escList=Object.values(_escAll);
  if(_escList.length){
    out+=`\nESCALATED:\n`;
    _escList.forEach(e=>{ out+=`  ⚡ ${(e.text||"").trim()}\n`; });
  }
  // Week Priorities P1-P5, always shown regardless of done state, for the same week
  // the Week line above already resolved.
  if(_wi>=0){
    const _wk2=Q2_WEEKS[_wi];
    const _wa=_exReadLS("lifeos_v8_weekAssess")||{};
    const _pc=_exReadLS(K_PRI_CHECKS)||{};
    const _pris=(_wa["w"+_wk2.n]?.priorities)||[];
    const _prisChecked=_pc["w"+_wk2.n]||[];
    if(_pris.some(p=>(p||"").trim())){
      out+=`\nWEEK PRIORITIES (${wkLabel(_wk2)}):\n`;
      _pris.forEach((p,i)=>{ if((p||"").trim()) out+=`  ${i+1}. [${_prisChecked.includes(i)?"✓":"·"}] ${p}\n`; });
    }
  }
  const marks=ALL_HATS.filter(h=>data.grid?.[h.code]?.[d]).map(h=>hatLabel(h.code,m,d)+(data.grid[h.code][d]==="box"?"⊠":data.grid[h.code][d]==="skip"?"–":"✓"));
  out+=`\nHATS MARKED: ${marks.length?marks.join("  "):"-"}\n`;
  const note=data.notes?.[d]; if(note?.trim()) out+=`\nNOTE:\n  ${note.trim().split("\n").join("\n  ")}\n`;
  const hl=data.highlights?.[d]; if(hl?.trim()){
    const _hc=(_exReadLS(K_HL_CHECKED)||{})[m+"-"+d];
    const _hs=(_exReadLS(K_HL_STARS)||{})[m+"-"+d]||0;
    out+=`\n✨ HIGHLIGHT${_hc?" ✓":""}${_hs?" [stood out: "+"⭐".repeat(_hs)+"]":""}:\n  ${hl.trim()}\n`;
  }
  const mn=data.moodNotes?.[d]; if(mn?.trim()) out+=`\n〰️ MOOD SHIFT:\n  ${mn.trim()}\n`;

function buildFullGridText(allData){
  const tc=_exReadLS(K_TASK_CHECKS)||{};
  const MNAME={4:"APRIL",5:"MAY",6:"JUNE",7:"JULY",8:"AUGUST",9:"SEPTEMBER",10:"OCTOBER"};
  const MSHORT={4:"APR",5:"MAY",6:"JUN",7:"JUL",8:"AUG",9:"SEP",10:"OCT"};
  let out=`LIFE OS - FULL QUARTER GRID · APR 1 – ${MSHORT[TODAY_M]||TODAY_M} ${TODAY_D}, 2026\n`;
  out+=`Legend: ✓ done · ⊠ boxing (counts 2) · ◀ back · % = Top3 day · T3 = tasks checked · E energy · M mood\n`;
  MONTHS_ARR.forEach((mo,mi)=>{
    const elapsed=(mo.m<TODAY_M)?mo.days:(mo.m===TODAY_M?TODAY_D:0);
    if(!elapsed) return;
    const data=allData[mi];
    if(!data) return;
    out+=`\n${MNAME[mo.m]||mo.name} 2026\n`;
    for(let d=1;d<=elapsed;d++){
      const pct=top3pct(data,d,mo.m);
      const en=data.energy?.[d]||"·";
      const mood=data.mood?.[d]||"·";
      const t3n=["t1","t2","t3"].filter(s=>!!tc[mo.m+"-"+d+"-"+s+"-c"]).length;
      const marks=ALL_HATS.map(h=>{
        const st=data.grid?.[h.code]?.[d];
        if(!st) return null;
        return h.code+(st==="box"?"⊠":st==="back"?"◀":"✓");
      }).filter(Boolean).join(" ");
      out+=`  ${String(d).padStart(2," ")} ${weekdayShort(mo.m,d)} | ${String(pct).padStart(3," ")}% T3:${t3n}/3 E:${en} M:${mood} | ${marks||"-"}\n`;
      const hl=data.highlights?.[d];
      if(hl&&hl.trim()){const _hc=(_exReadLS(K_HL_CHECKED)||{})[mo.m+"-"+d];out+=`       ✨${_hc?"✓":""} ${hl.trim()}\n`;}
    }
    const tot=ALL_HATS.map(h=>{
      let n=0;
      for(let d=1;d<=elapsed;d++){n+=cellWeight(data.grid?.[h.code]?.[d]);}
      return n?`${hatLabel(h.code,mo.m,elapsed)}:${n}`:null;
    }).filter(Boolean).join("  ");
    out+=`  ${mo.short} TOTALS (${elapsed}d): ${tot||"-"}\n`;
  });
  out+=`\nend of full quarter grid`;
  return out;
}

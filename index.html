                if(isHeading){
                  out.push(<div key={i} style={{fontSize:11,fontWeight:900,color:"#b8860b",letterSpacing:1.5,textTransform:"none",marginTop:out.length?14:0,marginBottom:4,fontFamily:"inherit"}}>{t.replace(/[:：]$/,"")}</div>);
                } else if(isQuote){
                  out.push(<div key={i} style={{fontSize:13,fontFamily:"Georgia,serif",fontStyle:"italic",color:"#7a5c2e",lineHeight:1.55,margin:"6px 0",paddingLeft:10,borderLeft:"2px solid #e6d3a8"}}>{t}</div>);
                } else if(isBullet){
                  out.push(
                    <div key={i} style={{display:"flex",gap:8,margin:"3px 0",paddingLeft:4}}>
                      <span style={{color:"#c9a96e",fontWeight:900,flexShrink:0,lineHeight:1.6}}>•</span>
                      <span style={{fontSize:12.5,fontFamily:"Georgia,serif",color:"#241c12",lineHeight:1.6}}>{t.replace(/^[-•·*–—]\s+/,"")}</span>
                    </div>
                  );
                } else if(isNumbered){
                  const m=t.match(/^(\d+)[.)]\s+(.*)$/);
                  out.push(
                    <div key={i} style={{display:"flex",gap:8,margin:"3px 0",paddingLeft:4}}>
                      <span style={{color:"#c9a96e",fontWeight:900,flexShrink:0,lineHeight:1.6,minWidth:16}}>{m[1]}.</span>
                      <span style={{fontSize:12.5,fontFamily:"Georgia,serif",color:"#241c12",lineHeight:1.6}}>{m[2]}</span>
                    </div>
                  );
                } else {
                  out.push(<div key={i} style={{fontSize:12.5,fontFamily:"Georgia,serif",color:"#241c12",lineHeight:1.7,margin:"2px 0",wordBreak:"break-word"}}>{t}</div>);
                }
              });
              return out;
            })()}
          </div>
          :<div style={{textAlign:"center",padding:"36px 20px",color:"#b0a898",fontSize:11,lineHeight:1.6}}>
            Your Vision lives here.<br/>Tap ✏ EDIT and paste the latest version<br/>from Notion. It saves on this device.
          </div>
      }
    </div>
  );
}

// ── ATLAS PANEL ──────────────────────────────────────────────────────────────
function AtlasRoutines({onBack}) {
  const RK="lifeos_routines26";
  const SEED=[
    {id:"w1",period:"week",text:"Water the flowers"},
    {id:"w2",period:"week",text:"Floss my teeth"},
    {id:"m1",period:"month",text:"Change the bedspread on the bed"},
    {id:"q1",period:"quarter",text:"Create the Vision for the next quarter"},
  ];
  const load=()=>{try{const v=localStorage.getItem(RK);const st=v?JSON.parse(v):null;if(st&&Array.isArray(st.items))return st;}catch(e){}return {items:SEED,checks:{}};};
  const [state,setState]=useState(load);
  const save=(next)=>{setState(next);lsWrite(RK,JSON.stringify(next));};
  // Period keys: when the week / month / quarter rolls over, the key changes and
  // every check in that group resets automatically.
  const curWeek=Q2_WEEKS.find(w=>TODAY_M*100+TODAY_D>=w.start[0]*100+w.start[1]&&TODAY_M*100+TODAY_D<=w.end[0]*100+w.end[1]);
  const periodKey=(period)=>{
    if(period==="week") return curWeek?("26Q"+(curWeek.q||2)+"-W"+(curWeek.wn||curWeek.n)):("wk-"+TODAY_M+"-"+TODAY_D);
    if(period==="month") return "2026-"+TODAY_M;
    return curWeek?("26Q"+(curWeek.q||2)):(TODAY_M>=7?"26Q3":"26Q2");
  };
  const isDone=(it)=>state.checks[it.id]===periodKey(it.period);
  const toggle=(it)=>{
    const checks={...state.checks};
    if(isDone(it)) delete checks[it.id]; else checks[it.id]=periodKey(it.period);
    save({...state,checks});
  };
  const [drafts,setDrafts]=useState({week:"",month:"",quarter:""});
  const addItem=(period)=>{
    const t=(drafts[period]||"").trim(); if(!t) return;
    save({...state,items:[...state.items,{id:"u"+Date.now(),period,text:t}]});
    setDrafts(d=>({...d,[period]:""}));
  };
  const delItem=(it)=>{
    if(!confirm('Remove "'+it.text+'" from routines?')) return;
    const checks={...state.checks}; delete checks[it.id];
    save({items:state.items.filter(x=>x.id!==it.id),checks});
  };
  const GROUPS_R=[
    {period:"week",   label:"ONCE A WEEK",    sub:"resets every week",    cur:curWeek?wkLabel(curWeek):"", color:"#0369a1", bg:"#f0f9ff", bdr:"#bae0f5"},
    {period:"month",  label:"ONCE A MONTH",   sub:"resets every month",   cur:M_LABEL[TODAY_M]||"", color:"#b8860b", bg:"#fffbeb", bdr:"#f0dfb0"},
    {period:"quarter",label:"ONCE A QUARTER", sub:"resets every quarter", cur:periodKey("quarter"), color:"#7c3aed", bg:"#f5f3ff", bdr:"#ddd3f5"},
  ];
  return (
    <div>
      <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:8,background:"#f2ede6",border:"none",borderRadius:20,padding:"8px 16px 8px 12px",cursor:"pointer",fontFamily:"inherit",marginBottom:16,boxShadow:"0 2px 8px rgba(0,0,0,0.08)"}}>
        <span style={{fontSize:18,color:"#c9a96e",fontWeight:900,lineHeight:1}}>‹</span>
        <span style={{fontSize:10,fontWeight:800,color:"#2a2118",letterSpacing:2}}>ATLAS</span>
      </button>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:18,fontWeight:900,color:"#0369a1",letterSpacing:-0.5}}>🔁 Routines</div>
        <div style={{fontSize:8,color:"#7a6f63",letterSpacing:2,marginTop:2}}>ONCE A WEEK · ONCE A MONTH · ONCE A QUARTER</div>
      </div>
      {GROUPS_R.map(grp=>{
        const items=state.items.filter(it=>it.period===grp.period);
        const doneN=items.filter(isDone).length;
        return (
          <div key={grp.period} style={{background:"#fff",borderRadius:16,border:"1px solid #f0ebe2",marginBottom:12,overflow:"hidden",boxShadow:"0 3px 16px rgba(42,33,24,0.06)"}}>
            <div style={{padding:"9px 14px",background:grp.bg,borderBottom:"1px solid "+grp.bdr,display:"flex",alignItems:"center",gap:8}}>
              <span style={{width:6,height:6,borderRadius:"50%",background:grp.color}}/>
              <span style={{fontSize:9,fontWeight:900,letterSpacing:2,color:grp.color}}>{grp.label}</span>
              <span style={{fontSize:7,color:"#7a6f63",fontWeight:700,letterSpacing:0.5}}>{grp.cur} · {grp.sub}</span>
              <span style={{flex:1}}/>
              <span style={{fontSize:9,fontWeight:900,color:doneN===items.length&&items.length>0?"#16a34a":"#b0a594"}}>{doneN}/{items.length}</span>
            </div>
            {items.map(it=>{
              const done=isDone(it);
              return (
                <div key={it.id} style={{display:"flex",alignItems:"center",gap:9,padding:"10px 12px",borderTop:"1px solid #f3efe7"}}>
                  <button onClick={()=>toggle(it)} style={{flexShrink:0,width:26,height:26,borderRadius:"50%",border:"2px solid "+(done?"#16a34a":"#d8cdb8"),background:done?"#16a34a":"#fff",cursor:"pointer",padding:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff",lineHeight:1,touchAction:"manipulation"}}>{done?"✓":""}</button>
                  <span style={{flex:1,fontSize:12,color:done?"#c8bfaf":"#241c12",fontWeight:done?400:600,textDecoration:done?"line-through":"none",textDecorationColor:"rgba(170,158,138,0.45)",textDecorationThickness:"1px",lineHeight:1.4}}>{it.text}</span>
                  <button onClick={()=>delItem(it)} title="Remove" style={{flexShrink:0,width:26,height:26,borderRadius:6,background:"none",border:"none",color:"#7a6f63",fontSize:12,cursor:"pointer",padding:0,touchAction:"manipulation"}}>✕</button>
                </div>
              );
            })}
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderTop:"1px solid #f3efe7",background:"#fffdf8"}}>
              <input value={drafts[grp.period]} onChange={e=>setDrafts(d=>({...d,[grp.period]:e.target.value}))}
                onKeyDown={e=>{if(e.key==="Enter")addItem(grp.period);}} placeholder="Add routine..."
                style={{flex:1,border:"none",outline:"none",background:"none",fontSize:11,fontFamily:"inherit",color:"#241c12",minWidth:0}}/>
              <button onClick={()=>addItem(grp.period)} style={{flexShrink:0,background:grp.color,color:"#fff",border:"none",borderRadius:14,padding:"4px 12px",fontSize:8,fontWeight:900,letterSpacing:1,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>+ ADD</button>
            </div>
          </div>
        );
      })}
      <div style={{fontSize:8,color:"#7a6f63",textAlign:"center",padding:"4px 0 14px",lineHeight:1.5}}>Checks reset automatically when a new week, month, or quarter starts.</div>
    </div>
  );
}

// ── GLOSSARY (Atlas) ────────────────────────────────────────────────────────
// Plain reference so the vocabulary is learnable: interface parts, grid states,
// and the counting rules that decide what a mark means.
function AtlasGlossary({onBack}) {
  const GROUPS_G=[
    {title:"INTERFACE", color:"#6d28d9", bg:"#f5f3ff", bdr:"#ddd3f5", items:[
      ["Tab","The four main screens: Today, Plan, Month, Atlas."],
      ["Card","A block with its own border and shadow. Top 3 Tasks, Brainstorm and Wins are cards."],
      ["Section","A labelled group inside a card. ESSENTIALS and TRACKING are sections of the grid."],
      ["Cell","One square you tap. A grid square, a day in the strip, the WEEK button."],
      ["Chip","A small pill-shaped label. The date badge on a card header, a week in Atlas."],
      ["Row","One horizontal line in the grid. One row is one day."],
      ["Column","One vertical line in the grid. One column is one HAT code."],
      ["Strip","The row of seven days plus the WEEK cell at the top of Today."],
      ["Grid","The full table of days by codes. Month shows the whole month, Today shows this week."],
      ["Mini grid","The seven-day grid inside Today. Same columns and colors as Month."],
      ["Header","The top line of a card or grid, holding the title and the group labels."],
      ["Placeholder","The grey example text inside an empty field. It is not saved."],
      ["Toggle","A control with two states, like the FINAL checkbox."],
      ["Badge / marker","A small symbol on top of something else. The star on the WEEK cell."],
    ]},
    {title:"GRID STATES", color:"#bf5000", bg:"#fff3e0", bdr:"#ffb74d", items:[
      ["· empty","Not done, not tracked. The default."],
      ["× done","Done once. One tap."],
      ["⊠ boxing","Boxing technique: counts as TWO sessions in one day. Two taps."],
      ["■ deep","A Deep Work session: one long block of undivided focus, phone away. Not about how many, about how deep."],
      ["◀ back","A back entry: logged after the fact for an earlier day. PB1, PB2, RJ1 and MM never take back entries."],
      ["Grey fill","The weekly goal for that tracking code is already met this week."],
    ]},
    {title:"COUNTING", color:"#0d9488", bg:"#f0fdfa", bdr:"#99f6e4", items:[
      ["T1 · T2 · T3","The Top 3 tasks. T1 is the oldest avoided thing, T2 moves a quarter goal, T3 is life."],
      ["Weighted score","T1 is worth 60 percent, T2 and T3 are worth 20 each. Only T1 done is still a productive day."],
      ["Streak","Days in a row where all three tasks were done. Separate from the percentage."],
      ["Escalated","Marked with the \u26a1 button on a task, or automatically after it has been carried three days running. It stays flagged through any rewording, and only deleting the task clears it."],
      ["Carried","Sent to the next day with the \u2192 button under the tick. The task is copied forward, never removed from today. Three days running flags it as escalated."],
      ["Backlog","Slots 4 to 10. Ideas, not commitments. No guilt attached."],
      ["4d badge","The red count on a task: how many days running it has carried the same wording. Tap it to promote the task to T1."],
      ["Pillars","PW, PA, MS. Measured, not required daily."],
      ["Essentials","The six daily codes. Counted as days out of seven."],
      ["Tracking","DT, PR, MV, SM. Counted against a weekly target, never out of seven."],
      ["Pulse","Energy and mood together, the two columns after the tasks."],
      ["Week Priorities","P1 to P5 in Today. What the WEEK is for, decided once and left alone. Not a daily list."],
      ["Note","One line for the day in Today. Clears the mind, not a task."],
      ["Mood Shift","In Today. Only filled when the mood actually moved, and what caused it."],
      ["Extra Hats","One-off HATs added to a single day without changing the fixed grid columns."],
      ["Quarter","Q3 runs Jul 6 to Oct 4, thirteen weeks. Q2 is everything before Jul 6. Archived quarters never recalculate."],
      ["Week Runner","The single 0 to 700 bar at the top of Today. One marker per day at its real cumulative position, gold when that day closed at 100."],
    ]},
    {title:"PLAN TAB", color:"#4338ca", bg:"#eef2ff", bdr:"#c7d2fe", items:[
      ["Brainstorm","The day's raw ideas, one per line. The main card in Plan, gold header."],
      ["Carried Over","Every idea from a past day that is still not done, oldest first. A view, not a store: an idea leaves the moment it is done or moved."],
      ["Future Projects","A standing pool of things to do one day but not this week. Ranked by you with the arrows. Goes into the week export."],
      ["Move to today","The \u2192 on a Carried Over idea. It RELOCATES the idea, never copies it, so it only ever exists in one place."],
    ]},
    {title:"WINS", color:"#b8860b", bg:"#fffbeb", bdr:"#f0dfb0", items:[
      ["Full win","⭐ with a date, HAT codes, what happened, the result and why it matters."],
      ["Part win","▫️ a fragment of a story still in progress. No stars until the arc closes."],
      ["Weekly Wins","The processed list for one week. Same store whether opened from Today or from Atlas, so it is one list seen from two places."],
      ["Raw wins","The unprocessed daily win notes the weekly list gets built from. Reference, kept at the bottom of the card."],
      ["Stars","⭐ a real step · ⭐⭐ a milestone · ⭐⭐⭐ life-changing · 💎 permanently changes who you are."],
      ["Highlight","One line about what the day felt like. Wins track what was built."],
      ["☆ vs ★","On the WEEK cell: hollow means wins are written, gold means the week is closed."],
    ]},
  ];
  return (
    <div>
      <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:8,background:"#f2ede6",border:"none",borderRadius:20,padding:"8px 16px 8px 12px",cursor:"pointer",fontFamily:"inherit",marginBottom:16,boxShadow:"0 2px 8px rgba(0,0,0,0.08)"}}>
        <span style={{fontSize:18,color:"#c9a96e",fontWeight:900,lineHeight:1}}>‹</span>
        <span style={{fontSize:10,fontWeight:800,color:"#2a2118",letterSpacing:2}}>ATLAS</span>
      </button>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:18,fontWeight:900,color:"#6d28d9",letterSpacing:-0.5}}>📖 Glossary</div>
        <div style={{fontSize:8,color:"#7a6f63",letterSpacing:2,marginTop:2}}>WHAT EVERYTHING IS CALLED</div>
      </div>
      {GROUPS_G.map(g=>(
        <div key={g.title} style={{background:"#fff",borderRadius:16,border:"1px solid #f0ebe2",marginBottom:12,overflow:"hidden",boxShadow:"0 3px 16px rgba(42,33,24,0.06)"}}>
          <div style={{padding:"9px 14px",background:g.bg,borderBottom:"1px solid "+g.bdr,display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:6,height:6,borderRadius:"50%",background:g.color}}/>
            <span style={{fontSize:9,fontWeight:900,letterSpacing:2,color:g.color}}>{g.title}</span>
          </div>
          {g.items.map(([term,def])=>(
            <div key={term} style={{padding:"11px 14px 12px",borderTop:"1px solid #f0ebe2"}}>
              <div style={{fontSize:11.5,fontWeight:900,color:"#241c12",letterSpacing:0.2,marginBottom:4}}>{term}</div>
              <div style={{fontSize:12,color:"#3a3025",lineHeight:1.65}}>{def}</div>
            </div>
          ))}
        </div>
      ))}
      <div style={{fontSize:10,color:"#6b6157",textAlign:"center",padding:"8px 10px 18px",lineHeight:1.6}}>One list, one language. Use these words and any chat will know exactly what you mean.</div>
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [tabIdx,setTabIdx]=useState(0);
  const [dragX,setDragX]=useState(0);
  const [isDrag,setIsDrag]=useState(false);
  const tsX=useRef(null),tsY=useRef(null),wRef=useRef(390);

  // Rotating mantra
  const [mantraIdx,setMantraIdx]=useState(()=>Math.floor(Math.random()*ALL_QUOTES.length));
  const nextMantra=()=>setMantraIdx(i=>(i+1)%ALL_QUOTES.length);

  const [monthIdx,setMonthIdx]=useState(()=>Math.max(0,MONTHS_ARR.findIndex(m=>m.m===TODAY_M)));
  const [weekIdx,setWeekIdx]=useState(()=>{
    const i=Q2_WEEKS.findIndex(w=>TODAY_M*100+TODAY_D>=w.start[0]*100+w.start[1]&&TODAY_M*100+TODAY_D<=w.end[0]*100+w.end[1]);
    return i>=0?i:0;
  });
  const [viewDay,setViewDay]=useState(TODAY_D);
  const [viewM,setViewM]=useState(TODAY_M);

  // Day rollover: if the app was left open past midnight, refresh once when it becomes
  // visible again so "today" (and Move-to-today) points at the real current date.
  useEffect(()=>{
    const check=()=>{if(document.visibilityState==="visible"){const n=new Date();if(n.getDate()!==TODAY_D||n.getMonth()+1!==TODAY_M){location.reload();}}};
    document.addEventListener("visibilitychange",check);
    window.addEventListener("focus",check);
    return ()=>{document.removeEventListener("visibilitychange",check);window.removeEventListener("focus",check);};
  },[]);

  // localStorage helpers
  const LS_VERSION = "lifeos_v8";
  function lsGet(key, fallback) {
    try { const v=localStorage.getItem(LS_VERSION+"_"+key); return v?JSON.parse(v):fallback; } catch(e){ return fallback; }
  }
  function lsSet(key, val) {
    lsWrite(LS_VERSION+"_"+key, JSON.stringify(val));
  }

  // Persisted state: allData, hatCounts, weekAssess
  const [allData,setAllData]=useState(()=>{
    const d=lsGet("allData", MONTHS_ARR.map(m=>initMonth(m.days)));
    if(Array.isArray(d)&&d.length<MONTHS_ARR.length){
      for(let i=d.length;i<MONTHS_ARR.length;i++) d.push(initMonth(MONTHS_ARR[i].days));
    }
    // Append-only migration: months saved by an older version have no column for

  // appendTask: safely ADD a task to a day. Free-slot search happens INSIDE the
  // functional updater on fresh state, so it can never overwrite or delete an
  // existing task, even with rapid taps. Appends AFTER the last filled slot.
  // If the same text is already on that day, does nothing (no duplicates).
  const appendTask=(m,day,text)=>{
    const t=(text||"").replace(/\u200b/g,"").trim();
    if(!t) return;
    mutData(m,d=>{
      const cur=(d.tasks&&d.tasks[day])||{};
      // Scan all ten slots first: the duplicate guard must win over the free-slot
      // choice, so the loop always completes before firstFree is used.
      let firstFree=0;
      for(let s=1;s<=10;s++){
        const v=(cur["t"+s]||"").replace(/\u200b/g,"").trim();
        if(v===t) return d; // already there, never duplicate, never touch anything

      }

        {TABS.map((t,i)=>(
          <div key={t} data-tab={t} style={{position:i===tabIdx?"relative":"absolute",top:0,left:0,width:"100%",transform:`translateX(${slideX(i)}%)`,transition:isDrag?"none":"transform .28s cubic-bezier(.4,0,.2,1)",willChange:"transform",padding:"16px 14px 48px",boxSizing:"border-box",minHeight:"80vh"}}>
            {t==="today"&&<TodayPanel allData={allData} getMI={getMI} viewDay={viewDay} viewM={viewM} setViewDay={setViewDay} setViewM={setViewM} weekIdx={weekIdx} setWeekIdx={setWeekIdx} weekDays={weekDays} cycleCell={cycleCell} cycleEnergy={cycleEnergy} cycleMood={cycleMood} setTask={setTask} appendTask={appendTask} setNote={setNote} setHighlight={setHighlight} setMoodNote={setMoodNote} setWins={setWins} weekAssess={weekAssess} setAssess={setAssess} setPriority={setPriority} toggleExtraHat={toggleExtraHat} toggleLibHat={toggleLibHat} winsLogged={winsLogged} toggleWinsLogged={toggleWinsLogged} hlChecked={hlChecked} toggleHlChecked={toggleHlChecked} hlStars={hlStars} cycleHlStars={cycleHlStars} priChecks={priChecks} savePriChecks={savePriChecks} taskChecks={taskChecks} saveTaskChecks={saveTaskChecks} taskSlotsMap={taskSlotsMap} saveTaskSlotsMap={saveTaskSlotsMap} escalations={escalations} saveEscalations={saveEscalations} planData={planData}/> }
            {t==="month"&&<MonthPanel monthIdx={monthIdx} setMonthIdx={setMonthIdx} allData={allData} cycleCell={cycleCell} cycleEnergy={cycleEnergy} cycleMood={cycleMood} setTabIdx={setTabIdx} setViewDay={setViewDay} setViewM={setViewM} setWeekIdx={setWeekIdx} taskChecks={taskChecks}/>}
            {t==="plan"&&<PlanPanel viewM={viewM} viewDay={viewDay} setViewDay={setViewDay} setViewM={setViewM} planData={planData} setPlanField={setPlanField} allData={allData} getMI={getMI} setTask={setTask} appendTask={appendTask} taskChecks={taskChecks} saveTaskChecks={saveTaskChecks} taskSlotsMap={taskSlotsMap} saveTaskSlotsMap={saveTaskSlotsMap} escalations={escalations} saveEscalations={saveEscalations} weekAssess={weekAssess} setPriority={setPriority} setAssess={setAssess} priChecks={priChecks} savePriChecks={savePriChecks}/>}
            {t==="challenge"&&<ChallengePanel/>}
            {t==="atlas"&&<AtlasPanel allData={allData} monthIdx={monthIdx} setMonthIdx={setMonthIdx} toggleExtraHat={toggleExtraHat} toggleLibHat={toggleLibHat} setHighlight={setHighlight} setMoodNote={setMoodNote} setViewDay={setViewDay} setViewM={setViewM} setWeekIdx={setWeekIdx} setTabIdx={setTabIdx}/>}
          </div>
        ))}
      </div>

      <div style={{padding:"8px 12px calc(16px + env(safe-area-inset-bottom))",display:"flex",gap:5,justifyContent:"center",flexWrap:"nowrap",alignItems:"center"}}>
        <button onClick={()=>setShowExport(x=>!x)} style={{
          background:"#111",color:"#fff",border:"none",borderRadius:20,
          padding:"7px 12px",fontSize:8,letterSpacing:1.5,cursor:"pointer",
          fontFamily:"'SF Mono','Courier New',monospace",fontWeight:700,whiteSpace:"nowrap",
        }}>↗ EXPORT {wkLabel(Q2_WEEKS[weekIdx])}</button>
        <button onClick={saveJSON} style={{
          background:(backupDaysAgo==null||backupDaysAgo>7)?"#b91c1c":"#1b5e20",color:"#fff",border:"none",borderRadius:20,
          padding:"7px 12px",fontSize:8,letterSpacing:1.5,cursor:"pointer",
          fontFamily:"'SF Mono','Courier New',monospace",fontWeight:700,whiteSpace:"nowrap",
        }}>⬇ SAVE{backupDaysAgo==null?" · NEVER":backupDaysAgo===0?" · TODAY":" · "+backupDaysAgo+"D AGO"}</button>
        <label style={{
          background:"#1565c0",color:"#fff",border:"none",borderRadius:20,
          padding:"7px 12px",fontSize:8,letterSpacing:1.5,cursor:"pointer",
          fontFamily:"'SF Mono','Courier New',monospace",fontWeight:700,display:"inline-block",whiteSpace:"nowrap",
        }}>
          ⬆ LOAD
          <input type="file" accept=".json" onChange={loadJSON} style={{display:"none"}}/>
        </label>
        <button onClick={()=>{
          if('serviceWorker' in navigator){
            navigator.serviceWorker.getRegistrations().then(regs=>{
              const updates=regs.map(r=>r.update().catch(()=>{}));
              Promise.all(updates).then(()=>{
                caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).then(()=>{
                  window.location.reload(true);
                });
              });
            });
          } else { window.location.reload(true); }
        }} style={{
          background:"#7c3aed",color:"#fff",border:"none",borderRadius:20,
          padding:"7px 12px",fontSize:8,letterSpacing:1.5,cursor:"pointer",
          fontFamily:"'SF Mono','Courier New',monospace",fontWeight:700,whiteSpace:"nowrap",
        }}>⟳ UPDATE</button>
      </div>

      {showExport&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:100,display:"flex",alignItems:"flex-end"}}>
          <div style={{width:"100%",background:"#fff",borderRadius:"16px 16px 0 0",padding:"16px",maxHeight:"70vh",display:"flex",flexDirection:"column"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontSize:11,fontWeight:900,letterSpacing:2}}>EXPORT - PASTE INTO CLAUDE</span>
              <button onClick={()=>setShowExport(false)} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:"#999"}}>×</button>
            </div>
            <textarea
              readOnly
              value={buildExport()}
              style={{flex:1,border:"1px solid #e0e0e0",borderRadius:8,padding:"10px",fontSize:9,fontFamily:"'SF Mono','Courier New',monospace",color:"#241c12",resize:"none",lineHeight:1.6,background:"#fafafa"}}
              onFocus={e=>e.target.select()}
            />
            <button onClick={()=>{
              const txt=buildExport();
              if(navigator.clipboard){navigator.clipboard.writeText(txt);}
              else{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");document.body.removeChild(t);}
              setShowExport(false);
            }} style={{
              marginTop:10,background:"#111",color:"#fff",border:"none",borderRadius:10,
              padding:"12px",fontSize:10,letterSpacing:2,cursor:"pointer",fontWeight:700,
              fontFamily:"'SF Mono','Courier New',monospace",
            }}>COPY TO CLIPBOARD</button>
          </div>
        </div>
      )}

      <div style={{textAlign:"center",padding:"0 0 16px",fontSize:8.5,color:"#9a7b3c",fontWeight:800,letterSpacing:3}}>BE KONSTANTIN · ONE MOVE = FULL PRESENCE</div>
    </div>
  );
}

    class ErrorBoundary extends React.Component {
      constructor(p){super(p);this.state={err:null};}
      static getDerivedStateFromError(err){return {err};}
      render(){
        if(this.state.err){
          const msg=(this.state.err&&this.state.err.message)||String(this.state.err);
          return React.createElement("div",{style:{padding:"40px 20px",fontFamily:"-apple-system,system-ui,sans-serif",maxWidth:420,margin:"0 auto"}},
            React.createElement("div",{style:{fontSize:18,fontWeight:900,color:"#2a2118",marginBottom:8}},"App hit an error"),
            React.createElement("div",{style:{fontSize:12,color:"#666",lineHeight:1.5,marginBottom:6}},"Your data is safe. The buttons below fix the most common causes without losing your tasks, wins, budget, or grid."),
            React.createElement("div",{style:{fontSize:10,color:"#b45309",background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:8,padding:"8px 10px",marginBottom:16,wordBreak:"break-word",fontFamily:"monospace"}},msg),
            React.createElement("button",{onClick:()=>{try{localStorage.removeItem("lifeos_vision26");}catch(e){}location.reload();},style:{display:"block",width:"100%",background:"#2a2118",color:"#fff",border:"none",borderRadius:10,padding:"14px",fontSize:12,fontWeight:800,marginBottom:10,cursor:"pointer"}},"Clear Vision text & reload"),
            React.createElement("button",{onClick:()=>{try{localStorage.removeItem(K_ESCALATIONS);}catch(e){}location.reload();},style:{display:"block",width:"100%",background:"#6b5d4f",color:"#fff",border:"none",borderRadius:10,padding:"14px",fontSize:12,fontWeight:800,marginBottom:10,cursor:"pointer"}},"Clear escalation flags & reload"),
            React.createElement("button",{onClick:()=>location.reload(),style:{display:"block",width:"100%",background:"#eee",color:"#444",border:"none",borderRadius:10,padding:"14px",fontSize:12,fontWeight:800,cursor:"pointer"}},"Just reload")
          );
        }
        return this.props.children;
      }
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ErrorBoundary,null,React.createElement(App)));
    // Remove the boot splash on the next frame, once React has painted the app.
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{var s=document.getElementById("boot-splash");if(s&&s.parentNode)s.parentNode.removeChild(s);});});
  </script>
</body>
</html>
